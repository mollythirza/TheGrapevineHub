<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Grapevine — Scene Oral History & Voice Note Vault</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100%;
      min-height: 100%;
      background-color: #0d0d0d;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      overflow-x: hidden;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10000;
      background: rgba(13, 13, 13, 0.95);
      border-bottom: 2px solid #ff007f;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-logo {
      height: 32px;
      width: auto;
      filter: drop-shadow(0 0 6px #ff007f);
      flex-shrink: 0;
    }

    .brand-title {
      max-height: 20px;
      width: auto;
      object-fit: contain;
      filter: invert(1);
    }

    .nav-links a {
      color: #aaa;
      text-decoration: none;
      font-size: 12px;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #ff007f;
      text-shadow: 0 0 8px #ff007f;
    }

    main {
      max-width: 1200px;
      margin: 100px auto 60px;
      padding: 0 24px;
    }

    .hero-section {
      border: 1px solid #ff007f;
      background: rgba(20, 20, 20, 0.8);
      padding: 24px;
      border-radius: 6px;
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.25);
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .hero-text h1 {
      color: #ff007f;
      font-size: 24px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .hero-text p {
      color: #bbb;
      font-size: 13px;
      line-height: 1.5;
    }

    .btn-create-audio {
      background: #ff007f;
      color: #000;
      border: none;
      padding: 12px 20px;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
    }

    .filter-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 30px;
      justify-content: space-between;
      align-items: center;
    }

    .search-input {
      background: #111;
      border: 1px solid #ff007f;
      color: #fff;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 16px;
      border-radius: 4px;
      outline: none;
      min-width: 260px;
      flex: 1;
    }

    .category-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: #141414;
      color: #aaa;
      border: 1px solid #333;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
    }

    .filter-btn.active {
      background: #ff007f;
      color: #000;
      border-color: #ff007f;
      font-weight: bold;
    }

    .audio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .audio-card {
      background: #141414;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .audio-card:hover {
      border-color: #ff007f;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.35);
    }

    .card-badge {
      position: absolute;
      top: 16px;
      right: 16px;
      font-size: 10px;
      color: #ff007f;
      border: 1px solid #ff007f;
      padding: 2px 6px;
      border-radius: 3px;
      text-transform: uppercase;
    }

    .audio-info h3 {
      color: #fff;
      font-size: 16px;
      text-transform: uppercase;
      margin-bottom: 4px;
      padding-right: 70px;
    }

    .audio-info .speaker {
      color: #888;
      font-size: 11px;
      display: block;
      margin-bottom: 12px;
    }

    .audio-desc {
      color: #bbb;
      font-size: 12px;
      line-height: 1.4;
      margin-bottom: 16px;
    }

    .player-box {
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 12px;
    }

    audio {
      width: 100%;
      height: 36px;
      filter: invert(1) hue-rotate(270deg);
    }

    /* 📱 FULLY SCROLLABLE MOBILE MODAL FIX 📱 */
    #audio-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.92);
      z-index: 30000;
      display: none;
      overflow-y: auto;          /* Enables smooth scrolling on the entire backdrop */
      -webkit-overflow-scrolling: touch;
      padding: 30px 16px 100px 16px; /* Huge bottom padding to clear mobile keyboards */
      backdrop-filter: blur(6px);
    }

    .modal-card {
      background: #141414;
      border: 2px solid #ff007f;
      width: 100%;
      max-width: 480px;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 0 35px rgba(255, 0, 127, 0.5);
      margin: 30px auto;         /* Centers with top/bottom breathing room */
      position: relative;
    }

    .modal-card h2 {
      color: #ff007f;
      font-size: 16px;
      text-transform: uppercase;
      margin-bottom: 14px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 11px;
      color: #aaa;
      text-transform: uppercase;
    }

    .form-control {
      background: #0d0d0d;
      border: 1px solid #333;
      color: #fff;
      padding: 10px;
      font-family: inherit;
      font-size: 16px; /* Prevents mobile auto-zoom */
      border-radius: 4px;
      outline: none;
      width: 100%;
    }

    .form-control:focus {
      border-color: #ff007f;
    }

    .audio-mode-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .mode-tab {
      flex: 1;
      padding: 8px;
      background: #0d0d0d;
      border: 1px solid #333;
      color: #aaa;
      font-family: inherit;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
      text-align: center;
    }

    .mode-tab.active {
      border-color: #ff007f;
      color: #ff007f;
      font-weight: bold;
      background: rgba(255, 0, 127, 0.1);
    }

    .recorder-box {
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 14px;
      text-align: center;
    }

    .rec-timer {
      font-size: 20px;
      color: #ff007f;
      font-weight: bold;
      margin-bottom: 10px;
      display: block;
    }

    .rec-btn {
      background: #ff007f;
      color: #000;
      border: none;
      padding: 10px 16px;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
    }

    .rec-btn.stop {
      background: #ff3333;
      color: #fff;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .modal-btn {
      flex: 1;
      padding: 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-submit { background: #ff007f; color: #000; border: none; }
    .btn-cancel { background: transparent; color: #aaa; border: 1px solid #444; }
  </style>
</head>
<body>

  <header>
    <a href="https://mollythirza.github.io/TheGrapevineHub/" class="brand-container">
      <img src="grape-logo.png" alt="Grapevine Logo" class="brand-logo" onerror="this.style.display='none'">
      <img src="grapevine-title.png" alt="The Grapevine" class="brand-title" onerror="this.onerror=null; this.src=''; this.outerHTML='<h1 style=\'color:#ff007f;font-size:14px;\'>THE GRAPEVINE</h1>'">
    </a>
    <div class="nav-links">
      <a href="https://mollythirza.github.io/TheGrapevineHub/">← Back to Hub</a>
    </div>
  </header>

  <main>
    <div class="hero-section">
      <div class="hero-text">
        <h1>Scene Oral History & Voice Note Vault</h1>
        <p>Listen to raw voice notes, gig memories, venue lore, and underground oral histories recorded directly by members of our local DIY community.</p>
      </div>
      <button class="btn-create-audio" onclick="window.openAudioModal()">+ Record / Share Story</button>
    </div>

    <div class="filter-controls">
      <input type="text" id="search-input" class="search-input" placeholder="Search voice notes, speakers, venues..." oninput="window.filterAudio()">
      
      <div class="category-buttons">
        <button class="filter-btn active" onclick="window.setCategory('all', this)">All</button>
        <button class="filter-btn" onclick="window.setCategory('gig', this)">Gig Memories</button>
        <button class="filter-btn" onclick="window.setCategory('venue', this)">Venue Lore</button>
        <button class="filter-btn" onclick="window.setCategory('history', this)">Oral History</button>
      </div>
    </div>

    <div class="audio-grid" id="audio-grid"></div>
  </main>

  <!-- Submission Modal -->
  <div id="audio-modal">
    <div class="modal-card">
      <h2>Share Your Story</h2>
      <form id="audio-form">
        <div class="form-group">
          <label>Story / Note Title *</label>
          <input type="text" id="audio-title" class="form-control" placeholder="Title..." required>
        </div>
        <div class="form-group">
          <label>Your Name / Speaker *</label>
          <input type="text" id="audio-speaker" class="form-control" placeholder="Name..." required>
        </div>
        <div class="form-group">
          <label>Category *</label>
          <select id="audio-category" class="form-control" required>
            <option value="gig">Gig Memory</option>
            <option value="venue">Venue Lore</option>
            <option value="history">Oral History</option>
          </select>
        </div>
        <div class="form-group">
          <label>Brief Description *</label>
          <textarea id="audio-desc" class="form-control" rows="3" placeholder="What is this note about?" required></textarea>
        </div>

        <div class="form-group">
          <label>Audio Input Method *</label>
          <div class="audio-mode-tabs">
            <button type="button" class="mode-tab active" id="tab-record" onclick="window.setAudioMode('record')">🎙 Live Record</button>
            <button type="button" class="mode-tab" id="tab-upload" onclick="window.setAudioMode('upload')">📁 Upload File</button>
          </div>
        </div>

        <!-- Live Mic Recorder Box -->
        <div id="section-record" class="recorder-box">
          <span class="rec-timer" id="rec-timer">00:00</span>
          <div style="display: flex; gap: 8px; justify-content: center; margin-bottom: 10px;">
            <button type="button" class="rec-btn" id="btn-start-rec" onclick="window.startRecording()">● Record Voice Note</button>
            <button type="button" class="rec-btn stop" id="btn-stop-rec" onclick="window.stopRecording()" style="display:none;">■ Stop Recording</button>
          </div>
          <audio id="rec-preview" controls style="display:none; width: 100%; height: 36px; margin-top: 10px;"></audio>
        </div>

        <!-- File Upload Box -->
        <div id="section-upload" class="form-group" style="display:none;">
          <label>Select Audio File (MP3, WAV under 15MB)</label>
          <input type="file" id="audio-file" accept="audio/*" class="form-control">
        </div>

        <div class="modal-actions">
          <button type="button" class="modal-btn btn-cancel" onclick="window.closeAudioModal()">Cancel</button>
          <button type="submit" class="modal-btn btn-submit" id="submit-btn">Submit Recording →</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBozbn-0iQNhjuAcmL-dYOUtbhIYTjccYk",
      authDomain: "the-grapevine-5c046.firebaseapp.com",
      databaseURL: "https://the-grapevine-5c046-default-rtdb.firebaseio.com",
      projectId: "the-grapevine-5c046",
      storageBucket: "the-grapevine-5c046.firebasestorage.app",
      messagingSenderId: "606976230856",
      appId: "1:606976230856:web:161a12734239f248ce2cfd",
      measurementId: "G-V1KW1QSNWS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const audioRef = ref(db, 'oral_histories');

    let activeCategory = 'all';
    let currentInputMode = 'record';

    let mediaRecorder;
    let audioChunks = [];
    let recordedBase64 = null;
    let timerInterval;
    let secondsRecorded = 0;
    let recordedMimeType = 'audio/webm';

    onValue(audioRef, (snapshot) => {
      const data = snapshot.val();
      const grid = document.getElementById('audio-grid');
      grid.innerHTML = '';

      if (data) {
        const audioNotes = Object.values(data).reverse();
        audioNotes.forEach(item => {
          const card = document.createElement('div');
          card.className = 'audio-card';
          card.setAttribute('data-category', item.category);

          card.innerHTML = `
            <span class="card-badge">${item.badge}</span>
            <div class="audio-info">
              <h3>${item.title}</h3>
              <span class="speaker">Recounted by ${item.speaker}</span>
            </div>
            <p class="audio-desc">${item.desc}</p>
            <div class="player-box">
              <audio controls src="${item.audioSrc}"></audio>
            </div>
          `;
          grid.appendChild(card);
        });
      }
      window.filterAudio();
    });

    document.getElementById('audio-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      
      const title = document.getElementById('audio-title').value.trim();
      const speaker = document.getElementById('audio-speaker').value.trim();
      const category = document.getElementById('audio-category').value;
      const desc = document.getElementById('audio-desc').value.trim();
      const categoryLabels = { 'gig': 'Gig Memory', 'venue': 'Venue Lore', 'history': 'Oral History' };

      if (currentInputMode === 'record') {
        if (!recordedBase64) {
          alert("Please record a voice note before submitting!");
          return;
        }
        saveStoryToFirebase(recordedBase64, title, speaker, category, desc, categoryLabels);
      } else {
        const fileInput = document.getElementById('audio-file');
        if (!fileInput.files || !fileInput.files[0]) {
          alert("Please select an audio file to upload!");
          return;
        }

        const file = fileInput.files[0];
        submitBtn.innerText = "Encoding File...";
        submitBtn.disabled = true;

        const reader = new FileReader();
        reader.onload = function(event) {
          saveStoryToFirebase(event.target.result, title, speaker, category, desc, categoryLabels);
        };
        reader.readAsDataURL(file);
      }
    });

    async function saveStoryToFirebase(audioSrc, title, speaker, category, desc, categoryLabels) {
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.innerText = "Saving...";
      submitBtn.disabled = true;

      try {
        await push(audioRef, {
          title,
          speaker,
          category,
          desc,
          audioSrc,
          badge: categoryLabels[category] || 'Oral History',
          timestamp: Date.now()
        });

        submitBtn.innerText = "Submit Recording →";
        submitBtn.disabled = false;
        window.closeAudioModal();
      } catch (err) {
        console.error("Database error:", err);
        alert("Error saving story: Size limit reached. Try keeping recordings concise.");
        submitBtn.innerText = "Submit Recording →";
        submitBtn.disabled = false;
      }
    }

    window.setAudioMode = function(mode) {
      currentInputMode = mode;
      document.getElementById('tab-record').classList.toggle('active', mode === 'record');
      document.getElementById('tab-upload').classList.toggle('active', mode === 'upload');
      document.getElementById('section-record').style.display = (mode === 'record') ? 'block' : 'none';
      document.getElementById('section-upload').style.display = (mode === 'upload') ? 'block' : 'none';
    };

    window.startRecording = async function() {
      audioChunks = [];
      recordedBase64 = null;
      secondsRecorded = 0;

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'];
        for (const t of types) {
          if (MediaRecorder.isTypeSupported(t)) {
            recordedMimeType = t;
            break;
          }
        }

        mediaRecorder = new MediaRecorder(stream, { mimeType: recordedMimeType });

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) audioChunks.push(event.data);
        };

        mediaRecorder.onstop = () => {
          const audioBlob = new Blob(audioChunks, { type: recordedMimeType });
          const reader = new FileReader();
          reader.readAsDataURL(audioBlob);
          reader.onloadend = () => {
            recordedBase64 = reader.result;
            const preview = document.getElementById('rec-preview');
            preview.src = recordedBase64;
            preview.style.display = 'block';
          };
          stream.getTracks().forEach(track => track.stop());
        };

        mediaRecorder.start();

        document.getElementById('btn-start-rec').style.display = 'none';
        document.getElementById('btn-stop-rec').style.display = 'inline-block';
        document.getElementById('rec-preview').style.display = 'none';

        timerInterval = setInterval(() => {
          secondsRecorded++;
          const mins = String(Math.floor(secondsRecorded / 60)).padStart(2, '0');
          const secs = String(secondsRecorded % 60).padStart(2, '0');
          document.getElementById('rec-timer').innerText = `${mins}:${secs}`;
        }, 1000);

      } catch (err) {
        alert("Microphone permission denied or unsupported: " + err.message);
      }
    };

    window.stopRecording = function() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      clearInterval(timerInterval);
      document.getElementById('btn-start-rec').style.display = 'inline-block';
      document.getElementById('btn-start-rec').innerText = "● Record Again";
      document.getElementById('btn-stop-rec').style.display = 'none';
    };

    window.setCategory = function(cat, btnElement) {
      activeCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
      window.filterAudio();
    };

    window.filterAudio = function() {
      const searchElem = document.getElementById('search-input');
      const searchTerm = searchElem ? searchElem.value.toLowerCase() : '';
      document.querySelectorAll('.audio-card').forEach(card => {
        const category = card.getAttribute('data-category');
        const textContent = card.innerText.toLowerCase();
        const matchesCategory = (activeCategory === 'all' || category === activeCategory);
        const matchesSearch = textContent.includes(searchTerm);
        card.style.display = (matchesCategory && matchesSearch) ? 'flex' : 'none';
      });
    };

    window.openAudioModal = () => {
      document.getElementById('audio-modal').style.display = 'block';
      document.body.style.overflow = 'hidden';
    };

    window.closeAudioModal = () => {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
      clearInterval(timerInterval);
      document.getElementById('audio-modal').style.display = 'none';
      document.body.style.overflow = 'auto';
      document.getElementById('audio-form').reset();
      document.getElementById('rec-preview').style.display = 'none';
      document.getElementById('rec-timer').innerText = "00:00";
      document.getElementById('btn-start-rec').style.display = 'inline-block';
      document.getElementById('btn-start-rec').innerText = "● Record Voice Note";
      document.getElementById('btn-stop-rec').style.display = 'none';
      recordedBase64 = null;
      window.setAudioMode('record');
    };
  </script>
</body>
</html>
