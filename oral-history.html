<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Grapevine — Scene Oral History & Voice Note Vault</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100%;
      min-height: 100%;
      background-color: #0d0d0d;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      overflow-x: hidden;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10000;
      background: rgba(13, 13, 13, 0.95);
      border-bottom: 2px solid #ff007f;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      height: 32px;
      width: auto;
      filter: drop-shadow(0 0 6px #ff007f);
      flex-shrink: 0;
    }

    .brand-title {
      max-height: 20px;
      width: auto;
      object-fit: contain;
      filter: invert(1);
    }

    .nav-links a {
      color: #aaa;
      text-decoration: none;
      font-size: 12px;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #ff007f;
      text-shadow: 0 0 8px #ff007f;
    }

    main {
      max-width: 1200px;
      margin: 100px auto 60px;
      padding: 0 24px;
    }

    .hero-section {
      border: 1px solid #ff007f;
      background: rgba(20, 20, 20, 0.8);
      padding: 24px;
      border-radius: 6px;
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.25);
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .hero-text h1 {
      color: #ff007f;
      font-size: 24px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .hero-text p {
      color: #bbb;
      font-size: 13px;
      line-height: 1.5;
    }

    .btn-create-audio {
      background: #ff007f;
      color: #000;
      border: none;
      padding: 12px 20px;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
    }

    .filter-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 30px;
      justify-content: space-between;
      align-items: center;
    }

    .search-input {
      background: #111;
      border: 1px solid #ff007f;
      color: #fff;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 13px;
      border-radius: 4px;
      outline: none;
      min-width: 260px;
      flex: 1;
    }

    .category-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: #141414;
      color: #aaa;
      border: 1px solid #333;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
    }

    .filter-btn.active {
      background: #ff007f;
      color: #000;
      border-color: #ff007f;
      font-weight: bold;
    }

    .audio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .audio-card {
      background: #141414;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .audio-card:hover {
      border-color: #ff007f;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.35);
    }

    .card-badge {
      position: absolute;
      top: 16px;
      right: 16px;
      font-size: 10px;
      color: #ff007f;
      border: 1px solid #ff007f;
      padding: 2px 6px;
      border-radius: 3px;
      text-transform: uppercase;
    }

    .audio-info h3 {
      color: #fff;
      font-size: 16px;
      text-transform: uppercase;
      margin-bottom: 4px;
      padding-right: 70px;
    }

    .audio-info .speaker {
      color: #888;
      font-size: 11px;
      display: block;
      margin-bottom: 12px;
    }

    .audio-desc {
      color: #bbb;
      font-size: 12px;
      line-height: 1.4;
      margin-bottom: 16px;
    }

    .player-box {
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 12px;
    }

    audio {
      width: 100%;
      height: 36px;
      filter: invert(1) hue-rotate(270deg);
    }

    #audio-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 30000;
      display: none;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(5px);
      padding: 20px;
    }

    .modal-card {
      background: #141414;
      border: 2px solid #ff007f;
      width: 100%;
      max-width: 500px;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 0 35px rgba(255, 0, 127, 0.5);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-card h2 {
      color: #ff007f;
      font-size: 18px;
      text-transform: uppercase;
      margin-bottom: 16px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 11px;
      color: #aaa;
      text-transform: uppercase;
    }

    .form-control {
      background: #0d0d0d;
      border: 1px solid #333;
      color: #fff;
      padding: 10px;
      font-family: inherit;
      font-size: 12px;
      border-radius: 4px;
      outline: none;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .modal-btn {
      flex: 1;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-submit { background: #ff007f; color: #000; border: none; }
    .btn-cancel { background: transparent; color: #aaa; border: 1px solid #444; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand-container" style="text-decoration: none;">
      <img src="grape-logo.png" alt="Grapevine Logo" class="brand-logo" onerror="this.style.display='none'">
      <img src="grapevine-title.png" alt="The Grapevine" class="brand-title" onerror="this.onerror=null; this.src=''; this.outerHTML='<h1 style=\'color:#ff007f;font-size:14px;\'>THE GRAPEVINE</h1>'">
    </a>
    <div class="nav-links">
      <a href="index.html">← Back to Hub</a>
    </div>
  </header>

  <main>
    <div class="hero-section">
      <div class="hero-text">
        <h1>Scene Oral History & Voice Note Vault</h1>
        <p>Listen to raw voice notes, gig memories, venue lore, and underground oral histories recorded directly by members of our local DIY community.</p>
      </div>
      <button class="btn-create-audio" onclick="openAudioModal()">+ Record / Share Story</button>
    </div>

    <div class="filter-controls">
      <input type="text" id="search-input" class="search-input" placeholder="Search voice notes, speakers, venues..." oninput="filterAudio()">
      
      <div class="category-buttons">
        <button class="filter-btn active" onclick="setCategory('all', this)">All</button>
        <button class="filter-btn" onclick="setCategory('gig', this)">Gig Memories</button>
        <button class="filter-btn" onclick="setCategory('venue', this)">Venue Lore</button>
        <button class="filter-btn" onclick="setCategory('history', this)">Oral History</button>
      </div>
    </div>

    <div class="audio-grid" id="audio-grid"></div>
  </main>

  <div id="audio-modal">
    <div class="modal-card">
      <h2>Share Your Story</h2>
      <form id="audio-form">
        <div class="form-group">
          <label>Story / Note Title *</label>
          <input type="text" id="audio-title" class="form-control" placeholder="Title..." required>
        </div>
        <div class="form-group">
          <label>Your Name / Speaker *</label>
          <input type="text" id="audio-speaker" class="form-control" placeholder="Name..." required>
        </div>
        <div class="form-group">
          <label>Category *</label>
          <select id="audio-category" class="form-control" required>
            <option value="gig">Gig Memory</option>
            <option value="venue">Venue Lore</option>
            <option value="history">Oral History</option>
          </select>
        </div>
        <div class="form-group">
          <label>Brief Description *</label>
          <textarea id="audio-desc" class="form-control" rows="3" placeholder="What is this note about?" required></textarea>
        </div>
        <div class="form-group">
          <label>Audio File *</label>
          <input type="file" id="audio-file" accept="audio/*" class="form-control" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="modal-btn btn-cancel" onclick="closeAudioModal()">Cancel</button>
          <button type="submit" class="modal-btn btn-submit" id="submit-btn">Submit Recording →</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBozbn-0iQNhjuAcmL-dYOUtbhIYTjccYk",
      authDomain: "the-grapevine-5c046.firebaseapp.com",
      databaseURL: "https://the-grapevine-5c046-default-rtdb.firebaseio.com",
      projectId: "the-grapevine-5c046",
      storageBucket: "the-grapevine-5c046.firebasestorage.app",
      messagingSenderId: "606976230856",
      appId: "1:606976230856:web:161a12734239f248ce2cfd",
      measurementId: "G-V1KW1QSNWS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storage = getStorage(app);
    const audioRef = ref(db, 'oral_histories');

    let activeCategory = 'all';

    onValue(audioRef, (snapshot) => {
      const data = snapshot.val();
      const grid = document.getElementById('audio-grid');
      grid.innerHTML = '';

      if (data) {
        const audioNotes = Object.values(data).reverse();
        audioNotes.forEach(item => {
          const card = document.createElement('div');
          card.className = 'audio-card';
          card.setAttribute('data-category', item.category);

          card.innerHTML = `
            <span class="card-badge">${item.badge}</span>
            <div class="audio-info">
              <h3>${item.title}</h3>
              <span class="speaker">Recounted by ${item.speaker}</span>
            </div>
            <p class="audio-desc">${item.desc}</p>
            <div class="player-box">
              <audio controls src="${item.audioSrc}"></audio>
            </div>
          `;
          grid.appendChild(card);
        });
      }
      filterAudio();
    });

    document.getElementById('audio-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.innerText = "Uploading Audio...";
      submitBtn.disabled = true;

      const title = document.getElementById('audio-title').value.trim();
      const speaker = document.getElementById('audio-speaker').value.trim();
      const category = document.getElementById('audio-category').value;
      const desc = document.getElementById('audio-desc').value.trim();
      const fileInput = document.getElementById('audio-file');

      const categoryLabels = { 'gig': 'Gig Memory', 'venue': 'Venue Lore', 'history': 'Oral History' };

      let audioSrc = '';
      if (fileInput.files[0]) {
        const file = fileInput.files[0];
        const fileRef = storageRef(storage, 'audio/' + Date.now() + '_' + file.name);
        await uploadBytes(fileRef, file);
        audioSrc = await getDownloadURL(fileRef);
      }

      await push(audioRef, {
        title,
        speaker,
        category,
        desc,
        audioSrc,
        badge: categoryLabels[category] || 'Oral History',
        timestamp: Date.now()
      });

      submitBtn.innerText = "Submit Recording →";
      submitBtn.disabled = false;
      closeAudioModal();
    });

    window.setCategory = function(cat, btnElement) {
      activeCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
      filterAudio();
    };

    window.filterAudio = function() {
      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      document.querySelectorAll('.audio-card').forEach(card => {
        const category = card.getAttribute('data-category');
        const textContent = card.innerText.toLowerCase();
        const matchesCategory = (activeCategory === 'all' || category === activeCategory);
        const matchesSearch = textContent.includes(searchTerm);
        card.style.display = (matchesCategory && matchesSearch) ? 'flex' : 'none';
      });
    };

    window.openAudioModal = () => document.getElementById('audio-modal').style.display = 'flex';
    window.closeAudioModal = () => {
      document.getElementById('audio-modal').style.display = 'none';
      document.getElementById('audio-form').reset();
    };
  </script>
</body>
</html>
