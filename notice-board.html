<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Grapevine — Community Notice Board</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100%;
      min-height: 100%;
      background-color: #0d0d0d;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      overflow-x: hidden;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10000;
      background: rgba(13, 13, 13, 0.95);
      border-bottom: 2px solid #ff007f;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      height: 32px;
      width: auto;
      filter: drop-shadow(0 0 6px #ff007f);
      flex-shrink: 0;
    }

    .brand-title {
      max-height: 20px;
      width: auto;
      object-fit: contain;
      filter: invert(1);
    }

    .nav-links a {
      color: #aaa;
      text-decoration: none;
      font-size: 12px;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #ff007f;
      text-shadow: 0 0 8px #ff007f;
    }

    main {
      max-width: 1200px;
      margin: 100px auto 60px;
      padding: 0 24px;
    }

    .hero-section {
      border: 1px solid #ff007f;
      background: rgba(20, 20, 20, 0.8);
      padding: 24px;
      border-radius: 6px;
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.25);
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .hero-text h1 {
      color: #ff007f;
      font-size: 24px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .hero-text p {
      color: #bbb;
      font-size: 13px;
    }

    .btn-create-post {
      background: #ff007f;
      color: #000;
      border: none;
      padding: 12px 20px;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
    }

    .filter-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 30px;
      justify-content: space-between;
      align-items: center;
    }

    .search-input {
      background: #111;
      border: 1px solid #ff007f;
      color: #fff;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 13px;
      border-radius: 4px;
      outline: none;
      min-width: 260px;
      flex: 1;
    }

    .category-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: #141414;
      color: #aaa;
      border: 1px solid #333;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
    }

    .filter-btn.active {
      background: #ff007f;
      color: #000;
      border-color: #ff007f;
      font-weight: bold;
    }

    .pinboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .notice-card {
      background: #141414;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .notice-card:hover {
      border-color: #ff007f;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.35);
    }

    .card-badge {
      position: absolute;
      top: 16px;
      right: 16px;
      font-size: 10px;
      color: #ff007f;
      border: 1px solid #ff007f;
      padding: 2px 6px;
      border-radius: 3px;
      text-transform: uppercase;
    }

    .notice-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #333;
      margin-bottom: 14px;
      background: #000;
    }

    .notice-info h3 {
      color: #fff;
      font-size: 16px;
      text-transform: uppercase;
      margin-bottom: 4px;
      padding-right: 70px;
    }

    .notice-info .meta-tag {
      color: #888;
      font-size: 11px;
      display: block;
      margin-bottom: 12px;
    }

    .notice-desc {
      color: #bbb;
      font-size: 12px;
      line-height: 1.4;
      margin-bottom: 18px;
    }

    .btn-action {
      width: 100%;
      padding: 9px;
      background: transparent;
      border: 1px solid #ff007f;
      color: #ff007f;
      text-align: center;
      text-decoration: none;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: bold;
      border-radius: 3px;
      display: block;
    }

    .btn-action:hover {
      background: #ff007f;
      color: #000;
    }

    /* Modal Form */
    #post-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 30000;
      display: none;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(5px);
      padding: 20px;
    }

    .modal-card {
      background: #141414;
      border: 2px solid #ff007f;
      width: 100%;
      max-width: 500px;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 0 35px rgba(255, 0, 127, 0.5);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-card h2 {
      color: #ff007f;
      font-size: 18px;
      text-transform: uppercase;
      margin-bottom: 16px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 11px;
      color: #aaa;
      text-transform: uppercase;
    }

    .form-control {
      background: #0d0d0d;
      border: 1px solid #333;
      color: #fff;
      padding: 10px;
      font-family: inherit;
      font-size: 12px;
      border-radius: 4px;
      outline: none;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .modal-btn {
      flex: 1;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-submit { background: #ff007f; color: #000; border: none; }
    .btn-cancel { background: transparent; color: #aaa; border: 1px solid #444; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand-container" style="text-decoration: none;">
      <img src="grape-logo.png" alt="Grapevine Logo" class="brand-logo" onerror="this.style.display='none'">
      <img src="grapevine-title.png" alt="The Grapevine" class="brand-title" onerror="this.onerror=null; this.src=''; this.outerHTML='<h1 style=\'color:#ff007f;font-size:14px;\'>THE GRAPEVINE</h1>'">
    </a>
    <div class="nav-links">
      <a href="index.html">← Back to Hub</a>
    </div>
  </header>

  <main>
    <div class="hero-section">
      <div class="hero-text">
        <h1>Community Notice Board</h1>
        <p>Explore pinned gig announcements, member wanted posts, DIY workshops, and local classifieds posted live across all devices.</p>
      </div>
      <button class="btn-create-post" onclick="openPostModal()">+ Pin a Notice</button>
    </div>

    <div class="filter-controls">
      <input type="text" id="search-input" class="search-input" placeholder="Search notices, gigs, musicians wanted..." oninput="filterNotices()">
      <div class="category-buttons">
        <button class="filter-btn active" onclick="setCategory('all', this)">All</button>
        <button class="filter-btn" onclick="setCategory('gig', this)">Gigs & Shows</button>
        <button class="filter-btn" onclick="setCategory('wanted', this)">Musicians Wanted</button>
        <button class="filter-btn" onclick="setCategory('workshop', this)">Workshops & DIY</button>
      </div>
    </div>

    <div class="pinboard-grid" id="pinboard-grid"></div>
  </main>

  <div id="post-modal">
    <div class="modal-card">
      <h2>Pin a New Notice</h2>
      <form id="notice-form">
        <div class="form-group">
          <label>Notice Title *</label>
          <input type="text" id="post-title" class="form-control" placeholder="Title..." required>
        </div>
        <div class="form-group">
          <label>Category *</label>
          <select id="post-category" class="form-control" required>
            <option value="gig">Gig / Show Announcement</option>
            <option value="wanted">Musicians / Members Wanted</option>
            <option value="workshop">Workshop / DIY</option>
          </select>
        </div>
        <div class="form-group">
          <label>Description *</label>
          <textarea id="post-desc" class="form-control" rows="3" placeholder="Details..." required></textarea>
        </div>
        <div class="form-group">
          <label>Image File (Optional)</label>
          <input type="file" id="post-file" accept="image/*" class="form-control">
        </div>
        <div class="form-group">
          <label>Link / Email URL (Optional)</label>
          <input type="text" id="post-link" class="form-control" placeholder="https://...">
        </div>
        <div class="form-group">
          <label>Social Handle (Optional)</label>
          <input type="text" id="post-social" class="form-control" placeholder="@handle">
        </div>
        <div class="modal-actions">
          <button type="button" class="modal-btn btn-cancel" onclick="closePostModal()">Cancel</button>
          <button type="submit" class="modal-btn btn-submit" id="submit-btn">Pin Post →</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase Modular Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // Replace with your actual Firebase config keys from Firebase Console:
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storage = getStorage(app);
    const noticesRef = ref(db, 'notices');

    let activeCategory = 'all';

    // REAL-TIME LISTENER: Updates instantly across all connected devices
    onValue(noticesRef, (snapshot) => {
      const data = snapshot.val();
      const grid = document.getElementById('pinboard-grid');
      grid.innerHTML = '';

      if (data) {
        // Convert object to array and reverse to show newest first
        const notices = Object.values(data).reverse();
        
        notices.forEach(notice => {
          const card = document.createElement('div');
          card.className = 'notice-card';
          card.setAttribute('data-category', notice.category);

          let imageHTML = notice.imgSrc ? `<img src="${notice.imgSrc}" class="notice-img" alt="${notice.title}">` : '';
          let metaText = notice.social ? `Posted by ${notice.social}` : 'Posted by Scene Member';
          let linkHTML = notice.linkUrl ? `<a href="${notice.linkUrl}" target="_blank" class="btn-action">View Link / Contact →</a>` : '';

          card.innerHTML = `
            <span class="card-badge">${notice.badge}</span>
            ${imageHTML}
            <div class="notice-info">
              <h3>${notice.title}</h3>
              <span class="meta-tag">${metaText}</span>
            </div>
            <p class="notice-desc">${notice.desc}</p>
            ${linkHTML}
          `;
          grid.appendChild(card);
        });
      }
      filterNotices();
    });

    // Handle Form Submit
    document.getElementById('notice-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.innerText = "Posting...";
      submitBtn.disabled = true;

      const title = document.getElementById('post-title').value.trim();
      const category = document.getElementById('post-category').value;
      const desc = document.getElementById('post-desc').value.trim();
      const fileInput = document.getElementById('post-file');
      const linkUrl = document.getElementById('post-link').value.trim();
      const social = document.getElementById('post-social').value.trim();

      const categoryLabels = { 'gig': 'Gig Flyer', 'wanted': 'Member Wanted', 'workshop': 'Workshop' };

      let imgSrc = '';
      if (fileInput.files[0]) {
        const file = fileInput.files[0];
        const fileRef = storageRef(storage, 'notices/' + Date.now() + '_' + file.name);
        await uploadBytes(fileRef, file);
        imgSrc = await getDownloadURL(fileRef);
      }

      await push(noticesRef, {
        title,
        category,
        desc,
        imgSrc,
        linkUrl,
        social,
        badge: categoryLabels[category] || 'Notice',
        timestamp: Date.now()
      });

      submitBtn.innerText = "Pin Post →";
      submitBtn.disabled = false;
      closePostModal();
    });

    // Global Functions for UI Controls
    window.setCategory = function(cat, btnElement) {
      activeCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
      filterNotices();
    };

    window.filterNotices = function() {
      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      document.querySelectorAll('.notice-card').forEach(card => {
        const category = card.getAttribute('data-category');
        const textContent = card.innerText.toLowerCase();
        const matchesCategory = (activeCategory === 'all' || category === activeCategory);
        const matchesSearch = textContent.includes(searchTerm);
        card.style.display = (matchesCategory && matchesSearch) ? 'flex' : 'none';
      });
    };

    window.openPostModal = () => document.getElementById('post-modal').style.display = 'flex';
    window.closePostModal = () => {
      document.getElementById('post-modal').style.display = 'none';
      document.getElementById('notice-form').reset();
    };
  </script>
</body>
</html>
