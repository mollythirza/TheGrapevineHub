<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">
  <title>Notice Board — The Grapevine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #0d0d0d;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
    }

    /* Top Navigation Header */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(13, 13, 13, 0.95);
      border-bottom: 1px solid #ff007f;
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      height: 28px;
      width: auto;
      filter: drop-shadow(0 0 6px #ff007f);
      flex-shrink: 0;
    }

    .brand-title-img {
      max-height: 18px;
      width: auto;
      object-fit: contain;
      filter: invert(1);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .back-link {
      color: #aaa;
      font-size: 12px;
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #ff007f;
    }

    .submit-btn {
      background: #ff007f;
      color: #000;
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(255, 0, 127, 0.5);
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }

    .submit-btn:hover {
      background: #fff;
      box-shadow: 0 0 20px #fff;
    }

    /* Main Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .board-title-section {
      text-align: center;
      margin-bottom: 40px;
    }

    .board-title-section h1 {
      font-size: 28px;
      color: #ff007f;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
    }

    .board-title-section p {
      font-size: 12px;
      color: #aaa;
    }

    /* Live Flyer Grid */
    #flyer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 25px;
    }

    .flyer-card {
      background: #141414;
      border: 1px solid rgba(255, 0, 127, 0.4);
      border-radius: 6px;
      overflow: hidden;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
    }

    .flyer-card:hover {
      border-color: #ff007f;
      transform: translateY(-4px);
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
    }

    .flyer-image-container {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #000;
      overflow: hidden;
      position: relative;
    }

    .flyer-image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .flyer-content {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-grow: 1;
      justify-content: space-between;
    }

    .flyer-title {
      font-size: 14px;
      font-weight: bold;
      color: #fff;
    }

    .flyer-link {
      display: inline-block;
      text-align: center;
      background: transparent;
      border: 1px solid #ff007f;
      color: #ff007f;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 11px;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.2s;
    }

    .flyer-link:hover {
      background: #ff007f;
      color: #000;
    }

    /* Modal Overlay Popup */
    #modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 2000;
      display: none;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(5px);
      padding: 20px;
    }

    .modal-content {
      background: #141414;
      border: 2px solid #ff007f;
      width: 100%;
      max-width: 600px;
      height: 80vh;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 30px rgba(255, 0, 127, 0.5);
      overflow: hidden;
    }

    .modal-header {
      background: #1a1a1a;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ff007f;
    }

    .modal-header span {
      font-size: 14px;
      font-weight: bold;
      color: #ff007f;
      text-transform: uppercase;
    }

    .close-modal {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }

    .close-modal:hover {
      color: #ff007f;
    }

    .modal-body {
      flex-grow: 1;
      width: 100%;
      height: 100%;
      background: #fff;
    }

    .modal-body iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .loading-text, .error-text {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- Header with Brand Logo & Title -->
  <header>
    <div class="brand-container">
      <img src="grape-logo.png" alt="Grapevine Logo" class="brand-logo" onerror="this.style.display='none'">
      <img src="grapevine-title.png" alt="The Grapevine" class="brand-title-img" onerror="this.onerror=null; this.src=''; this.outerHTML='<h1 style=\'color:#ff007f;font-size:14px;\'>THE GRAPEVINE</h1>'">
    </div>
    <div class="header-actions">
      <a href="index.html" class="back-link">← Wall</a>
      <button class="submit-btn" id="open-modal-btn">+ Pin a Flyer</button>
    </div>
  </header>

  <div class="container">
    <div class="board-title-section">
      <h1>Notice Board</h1>
      <p>Live community flyers, gig posters, and announcements. Pinned automatically by the scene.</p>
    </div>

    <!-- Live Flyer Grid -->
    <div id="flyer-grid">
      <div class="loading-text">Loading community notices...</div>
    </div>
  </div>

  <!-- Submission Modal Popup -->
  <div id="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span>Pin Your Flyer to The Grapevine</span>
        <button class="close-modal" id="close-modal-btn">&times;</button>
      </div>
      <div class="modal-body">
        <script src="https://static.airtable.com/js/embed/embed_snippet_v1.js"></script><iframe class="airtable-embed airtable-dynamic-height" src="https://airtable.com/embed/appPjSSpMgtmXBouN/shrWKs6smV8calxpB" frameborder="0" onmousewheel="" width="100%" height="792" style="background: transparent; border: 1px solid #ccc;"></iframe>
      </div>
    </div>
  </div>

  <script>
    // --- AIRTABLE CONFIGURATION FOR FEED ---
    const AIRTABLE_API_KEY = 'patofpH96mlcRFtil.2e58895959f770a5c40cfc49ff4d858652b847b259ee8f443e4dc770242bb107';
    const BASE_ID = 'appPjSSpMgtmXBouN';
    const TABLE_NAME = 'Table 1';

    // Modal Controls
    const modalOverlay = document.getElementById('modal-overlay');
    const openModalBtn = document.getElementById('open-modal-btn');
    const closeModalBtn = document.getElementById('close-modal-btn');

    openModalBtn.addEventListener('click', () => {
      modalOverlay.style.display = 'flex';
    });

    closeModalBtn.addEventListener('click', () => {
      modalOverlay.style.display = 'none';
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        modalOverlay.style.display = 'none';
      }
    });

    // Fetch and Render Feed
    async function fetchFlyers() {
      const gridContainer = document.getElementById('flyer-grid');
      
      try {
        const response = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE_NAME)}`, {
          headers: {
            Authorization: `Bearer ${AIRTABLE_API_KEY}`
          }
        });

        if (!response.ok) throw new Error('Failed to fetch community data');

        const data = await response.json();
        
        if (data.records.length === 0) {
          gridContainer.innerHTML = '<div class="loading-text">No flyers pinned yet. Be the first to pin one!</div>';
          return;
        }

        gridContainer.innerHTML = '';

        data.records.forEach(record => {
          const fields = record.fields;
          const title = fields.Title || 'Community Notice';
          const imageUrl = fields.FlyerImage && fields.FlyerImage[0] ? fields.FlyerImage[0].url : '';
          const eventLink = fields.EventLink || '#';

          if (!imageUrl) return;

          const card = document.createElement('div');
          card.className = 'flyer-card';
          card.innerHTML = `
            <div class="flyer-image-container">
              <img src="${imageUrl}" alt="${title}" loading="lazy">
            </div>
            <div class="flyer-content">
              <div class="flyer-title">${title}</div>
              ${fields.EventLink ? `<a href="${eventLink}" target="_blank" class="flyer-link">View Event / Link →</a>` : ''}
            </div>
          `;
          gridContainer.appendChild(card);
        });

      } catch (error) {
        console.error(error);
        gridContainer.innerHTML = '<div class="error-text">Unable to load live feed right now. Check back soon!</div>';
      }
    }

    fetchFlyers();
  </script>

</body>
</html>
