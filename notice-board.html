<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Grapevine — Notice Board & Flyer Wall</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #0d0d0d;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10000;
      background: rgba(13, 13, 13, 0.95);
      border-bottom: 2px solid #ff007f;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-logo {
      height: 28px;
      width: auto;
      filter: drop-shadow(0 0 6px #ff007f);
      flex-shrink: 0;
    }

    .brand-title {
      max-height: 18px;
      width: auto;
      object-fit: contain;
      filter: invert(1);
    }

    .nav-links a {
      color: #aaa;
      text-decoration: none;
      font-size: 11px;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #ff007f;
      text-shadow: 0 0 8px #ff007f;
    }

    /* Control Bar */
    .filter-bar {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid #ff007f;
      border-radius: 6px;
      padding: 6px 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
      backdrop-filter: blur(6px);
      max-width: 92vw;
      overflow-x: auto;
    }

    .page-tag {
      font-size: 11px;
      font-weight: bold;
      color: #ff007f;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-right: 1px solid rgba(255, 0, 127, 0.4);
      padding-right: 10px;
      white-space: nowrap;
    }

    .filter-chip {
      background: #0d0d0d;
      color: #aaa;
      border: 1px solid #333;
      padding: 3px 8px;
      font-size: 10px;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-chip.active {
      background: #ff007f;
      color: #000;
      font-weight: bold;
      border-color: #ff007f;
    }

    /* Flyer Canvas */
    #wall-canvas {
      position: absolute;
      top: 50px;
      left: 0;
      width: 100vw;
      height: calc(100vh - 50px);
      background: #0d0d0d;
      background-image: radial-gradient(rgba(255, 0, 127, 0.08) 1px, transparent 1px);
      background-size: 30px 30px;
      overflow: auto;
    }

    #flyers-container {
      position: relative;
      width: 100%;
      min-height: 100%;
    }

    .flyer-post {
      position: absolute;
      width: 180px;
      background: #141414;
      border: 1px solid rgba(255, 0, 127, 0.6);
      border-radius: 4px;
      padding: 8px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(255, 0, 127, 0.3);
      transition: box-shadow 0.2s, border-color 0.2s, transform 0.2s;
      z-index: 10;
    }

    .flyer-post:hover {
      border-color: #ff007f;
      box-shadow: 0 0 22px rgba(255, 0, 127, 0.7);
      transform: scale(1.03);
      z-index: 50;
    }

    .flyer-img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 2px;
      margin-bottom: 6px;
    }

    .flyer-title {
      font-size: 11px;
      font-weight: bold;
      color: #ff007f;
      text-transform: uppercase;
      text-align: center;
      word-break: break-word;
    }

    .flyer-date-tag {
      font-size: 9px;
      color: #777;
      text-align: center;
      margin-top: 3px;
    }

    /* Pin Action Bar */
    .wall-toolbar {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
    }

    .btn-pin {
      background: #ff007f;
      color: #000;
      border: none;
      padding: 10px 18px;
      font-family: inherit;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
      transition: background 0.2s;
    }

    .btn-pin:hover {
      background: #ff3399;
    }

    /* 📱 Fully Scrollable & Compact Mobile Modals 📱 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.88);
      z-index: 40000;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 12px;
      backdrop-filter: blur(5px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .modal-card {
      background: #141414;
      border: 2px solid #ff007f;
      width: 100%;
      max-width: 440px;
      max-height: 82vh;          /* Strictly contained so it never exceeds phone height */
      overflow-y: auto;          /* Internal vertical scroll enabled */
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 0 35px rgba(255, 0, 127, 0.5);
      position: relative;
      margin: auto;
    }

    .modal-card h2 {
      color: #ff007f;
      font-size: 15px;
      text-transform: uppercase;
      margin-bottom: 10px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .form-group label {
      font-size: 10px;
      color: #aaa;
      text-transform: uppercase;
    }

    .form-control {
      background: #0d0d0d;
      border: 1px solid #333;
      color: #fff;
      padding: 7px;
      font-family: inherit;
      font-size: 16px; /* Prevents mobile browser auto-zoom */
      border-radius: 4px;
      outline: none;
      width: 100%;
    }

    .form-control:focus {
      border-color: #ff007f;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .modal-btn {
      flex: 1;
      padding: 9px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-submit { background: #ff007f; color: #000; border: none; }
    .btn-cancel { background: transparent; color: #aaa; border: 1px solid #444; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="https://mollythirza.github.io/TheGrapevineHub/" class="brand-container">
      <img src="grape-logo.png" alt="Grapevine Logo" class="brand-logo" onerror="this.style.display='none'">
      <img src="grapevine-title.png" alt="The Grapevine" class="brand-title" onerror="this.onerror=null; this.src=''; this.outerHTML='<h1 style=\'color:#ff007f;font-size:13px;\'>THE GRAPEVINE</h1>'">
    </a>
    <div class="nav-links">
      <a href="https://mollythirza.github.io/TheGrapevineHub/">← Back to Hub</a>
    </div>
  </header>

  <!-- Filter Controls -->
  <div class="filter-bar">
    <span class="page-tag">📌 Notice Board</span>
    <button class="filter-chip active" id="filter-all" onclick="window.setTimeFilter('all')">All</button>
    <button class="filter-chip" id="filter-recent" onclick="window.setTimeFilter('recent')">Recent</button>
    <button class="filter-chip" id="filter-older" onclick="window.setTimeFilter('older')">Archive</button>
  </div>

  <!-- Interactive Wall Canvas -->
  <main id="wall-canvas">
    <div id="flyers-container"></div>
  </main>

  <!-- Pin Button -->
  <div class="wall-toolbar">
    <button class="btn-pin" onclick="window.openCreateModal()">+ Pin Flyer</button>
  </div>

  <!-- Create Modal -->
  <div id="create-modal" class="modal-overlay" onclick="window.closeCreateModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <h2>Pin a Flyer / Notice</h2>
      <form id="create-form">
        <div class="form-group">
          <label>Notice / Gig Title *</label>
          <input type="text" id="notice-title" class="form-control" placeholder="e.g. Hardcore Fest 2026" required>
        </div>
        <div class="form-group">
          <label>Author / Band *</label>
          <input type="text" id="notice-author" class="form-control" placeholder="Your name..." required>
        </div>
        <div class="form-group">
          <label>Full Description / Details *</label>
          <textarea id="notice-desc" class="form-control" rows="2" placeholder="Date, venue, ticket info..." required></textarea>
        </div>
        <div class="form-group">
          <label>External Link / URL (Optional)</label>
          <input type="url" id="notice-link" class="form-control" placeholder="https://...">
        </div>
        <div class="form-group">
          <label>Flyer Image (Optional)</label>
          <input type="file" id="notice-image" accept="image/*" class="form-control">
        </div>
        <div class="modal-actions">
          <button type="button" class="modal-btn btn-cancel" onclick="window.closeCreateModal()">Cancel</button>
          <button type="submit" class="modal-btn btn-submit" id="submit-btn">Pin to Wall →</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detail-modal" class="modal-overlay" onclick="window.closeDetailModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <h2 id="detail-title">Notice Title</h2>
      <div id="detail-image-container" style="margin-bottom: 10px; text-align: center;"></div>
      <p style="font-size: 11px; color: #888; margin-bottom: 2px;">Pinned by <span id="detail-author" style="color: #ff007f;"></span></p>
      <p style="font-size: 10px; color: #666; margin-bottom: 10px;" id="detail-date"></p>
      <p id="detail-desc" style="font-size: 12px; color: #ccc; line-height: 1.4; margin-bottom: 14px; white-space: pre-wrap;"></p>
      
      <div id="detail-link-container" style="margin-bottom: 14px; display: none;">
        <a id="detail-link" href="#" target="_blank" rel="noopener noreferrer" style="display: block; width: 100%; background: rgba(255, 0, 127, 0.15); border: 1px solid #ff007f; color: #ff007f; text-align: center; padding: 9px; font-size: 11px; font-weight: bold; text-transform: uppercase; border-radius: 4px; text-decoration: none;">External Link ↗</a>
      </div>

      <button class="modal-btn btn-cancel" style="width: 100%;" onclick="window.closeDetailModal()">Close Flyer</button>
    </div>
  </div>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBozbn-0iQNhjuAcmL-dYOUtbhIYTjccYk",
      authDomain: "the-grapevine-5c046.firebaseapp.com",
      databaseURL: "https://the-grapevine-5c046-default-rtdb.firebaseio.com",
      projectId: "the-grapevine-5c046",
      storageBucket: "the-grapevine-5c046.firebasestorage.app",
      messagingSenderId: "606976230856",
      appId: "1:606976230856:web:161a12734239f248ce2cfd",
      measurementId: "G-V1KW1QSNWS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const noticesRef = ref(db, 'notices');

    let allNotices = {};
    let activeFilter = 'all';

    window.setTimeFilter = (filterType) => {
      activeFilter = filterType;
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      const activeBtn = document.getElementById(`filter-${filterType}`);
      if (activeBtn) activeBtn.classList.add('active');
      window.renderFlyers();
    };

    window.renderFlyers = () => {
      const container = document.getElementById('flyers-container');
      if (!container) return;
      container.innerHTML = '';
      
      const now = Date.now();
      const thirtyDaysMs = 30 * 24 * 60 * 60 * 1000;

      if (!allNotices || Object.keys(allNotices).length === 0) {
        container.innerHTML = `<p style="text-align:center; padding-top:140px; color:#666; font-size:12px;">No flyers posted yet. Be the first to pin one!</p>`;
        return;
      }

      const screenWidth = Math.max(window.innerWidth - 200, 280);
      const screenHeight = Math.max(window.innerHeight - 280, 350);

      Object.keys(allNotices).forEach((id, index) => {
        const item = allNotices[id];
        const postTime = item.timestamp || 0;
        const isRecent = (now - postTime) <= thirtyDaysMs;

        if (activeFilter === 'recent' && !isRecent) return;
        if (activeFilter === 'older' && isRecent) return;

        const flyer = document.createElement('div');
        flyer.className = 'flyer-post';
        
        const posX = item.x !== undefined ? item.x : ((index * 50 + 20) % screenWidth);
        const posY = item.y !== undefined ? item.y : (((index * 60) + 120) % screenHeight + 80);
        
        flyer.style.left = `${posX}px`;
        flyer.style.top = `${posY}px`;

        let imgHtml = item.imageSrc ? `<img src="${item.imageSrc}" class="flyer-img" alt="Flyer">` : '';
        const formattedDate = item.timestamp ? new Date(item.timestamp).toLocaleDateString() : '';

        flyer.innerHTML = `
          ${imgHtml}
          <div class="flyer-title">${item.title || 'Untitled Notice'}</div>
          <div class="flyer-date-tag">${formattedDate}</div>
        `;

        flyer.addEventListener('click', (e) => {
          e.stopPropagation();
          window.openDetailModal(id);
        });

        container.appendChild(flyer);
      });
    };

    onValue(noticesRef, (snapshot) => {
      const data = snapshot.val();
      allNotices = data || {};
      window.renderFlyers();
    });

    document.getElementById('create-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      
      const title = document.getElementById('notice-title').value.trim();
      const author = document.getElementById('notice-author').value.trim();
      const desc = document.getElementById('notice-desc').value.trim();
      const link = document.getElementById('notice-link').value.trim();
      const imageInput = document.getElementById('notice-image');

      submitBtn.innerText = "Pinning...";
      submitBtn.disabled = true;

      const screenW = Math.max(window.innerWidth - 220, 180);
      const screenH = Math.max(window.innerHeight - 300, 250);
      const randomX = Math.floor(Math.random() * screenW + 15);
      const randomY = Math.floor(Math.random() * screenH + 100);

      if (imageInput.files && imageInput.files[0]) {
        const reader = new FileReader();
        reader.onload = async function(event) {
          await pushToFirebase(title, author, desc, link, event.target.result, randomX, randomY);
        };
        reader.readAsDataURL(imageInput.files[0]);
      } else {
        await pushToFirebase(title, author, desc, link, null, randomX, randomY);
      }
    });

    async function pushToFirebase(title, author, desc, link, imageSrc, x, y) {
      try {
        await push(noticesRef, { title, author, desc, link, imageSrc, x, y, timestamp: Date.now() });
        window.closeCreateModal();
      } catch (err) {
        alert("Error pinning flyer: Image payload limit exceeded. Try a smaller file.");
      }
      document.getElementById('submit-btn').innerText = "Pin to Wall →";
      document.getElementById('submit-btn').disabled = false;
    }

    window.openCreateModal = () => {
      document.getElementById('create-modal').style.display = 'flex';
      document.body.style.overflow = 'hidden';
    };

    window.closeCreateModal = () => {
      document.getElementById('create-modal').style.display = 'none';
      document.body.style.overflow = 'auto';
      document.getElementById('create-form').reset();
    };

    window.openDetailModal = (id) => {
      const item = allNotices[id];
      if (!item) return;

      document.getElementById('detail-title').innerText = item.title;
      document.getElementById('detail-author').innerText = item.author || 'Anonymous';
      document.getElementById('detail-date').innerText = item.timestamp ? `Posted: ${new Date(item.timestamp).toLocaleString()}` : '';
      document.getElementById('detail-desc').innerText = item.desc;
      
      const linkContainer = document.getElementById('detail-link-container');
      const linkElement = document.getElementById('detail-link');
      if (item.link && item.link.trim() !== '') {
        linkElement.href = item.link;
        linkContainer.style.display = 'block';
      } else {
        linkElement.href = '#';
        linkContainer.style.display = 'none';
      }

      const imgContainer = document.getElementById('detail-image-container');
      if (item.imageSrc) {
        imgContainer.innerHTML = `<img src="${item.imageSrc}" style="max-height: 180px; max-width: 100%; border-radius: 4px; margin: 0 auto;" />`;
        imgContainer.style.display = 'block';
      } else {
        imgContainer.innerHTML = '';
        imgContainer.style.display = 'none';
      }

      document.getElementById('detail-modal').style.display = 'flex';
      document.body.style.overflow = 'hidden';
    };

    window.closeDetailModal = () => {
      document.getElementById('detail-modal').style.display = 'none';
      document.body.style.overflow = 'auto';
    };
  </script>
</body>
</html>
