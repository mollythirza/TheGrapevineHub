<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Grapevine — Underground Community Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #0d0d0d;
      /* Fullscreen cover background image */
      background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)), url('bathroom-wall.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    /* Fixed top black header bar */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10000;
      background: rgba(13, 13, 13, 0.95);
      border-bottom: 2px solid #ff007f;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-logo {
      height: 36px;
      width: auto;
      filter: drop-shadow(0 0 6px #ff007f);
      flex-shrink: 0;
    }

    .brand-title {
      max-height: 22px;
      width: auto;
      object-fit: contain;
      filter: invert(1);
    }

    .hub-tagline {
      font-size: 11px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Fullscreen hotspot canvas overlay */
    main {
      position: absolute;
      top: 60px;
      left: 0;
      width: 100%;
      height: calc(100vh - 60px);
      z-index: 1;
    }

    /* Pulsing pink neon hotspots placed over the background wall */
    .hotspot {
      position: absolute;
      border-radius: 50%;
      cursor: pointer;
      background: rgba(255, 0, 127, 0.2);
      animation: neonPulse 2s infinite ease-in-out;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .hotspot:hover {
      background: rgba(255, 0, 127, 0.45);
      transform: translate(-50%, -50%) scale(1.15);
      animation: none;
      box-shadow: 0 0 30px #ff007f, 0 0 60px #ff007f;
    }

    /* Neon Pulse Keyframes */
    @keyframes neonPulse {
      0% {
        box-shadow: 0 0 8px rgba(255, 0, 127, 0.5), inset 0 0 8px rgba(255, 0, 127, 0.3);
        border: 2px solid rgba(255, 0, 127, 0.6);
      }
      50% {
        box-shadow: 0 0 24px rgba(255, 0, 127, 0.95), 0 0 45px rgba(255, 0, 127, 0.7);
        border: 2px solid rgba(255, 0, 127, 1);
      }
      100% {
        box-shadow: 0 0 8px rgba(255, 0, 127, 0.5), inset 0 0 8px rgba(255, 0, 127, 0.3);
        border: 2px solid rgba(255, 0, 127, 0.6);
      }
    }

    /* Bottom hover marquee title */
    #hover-marquee {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(13, 13, 13, 0.95);
      border-top: 2px solid #ff007f;
      color: #ff007f;
      font-size: 13px;
      text-transform: uppercase;
      padding: 10px;
      text-align: center;
      letter-spacing: 2px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.2s ease;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
      pointer-events: none;
    }

    /* Modal Popup when Hotspot Clicked */
    #sticker-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 30000;
      display: none;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(6px);
      padding: 20px;
    }

    .modal-card {
      background: #141414;
      border: 2px solid #ff007f;
      width: 100%;
      max-width: 420px;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 0 40px rgba(255, 0, 127, 0.6);
    }

    .modal-sticker-img {
      height: 90px;
      width: auto;
      object-fit: contain;
      margin-bottom: 16px;
      filter: drop-shadow(0 0 10px rgba(255, 0, 127, 0.5));
    }

    .modal-title {
      color: #ff007f;
      font-size: 18px;
      text-transform: uppercase;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .modal-desc {
      color: #ccc;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-btn {
      flex: 1;
      padding: 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
    }

    .btn-visit { background: #ff007f; color: #000; border: none; }
    .btn-close { background: transparent; color: #aaa; border: 1px solid #444; }
  </style>
</head>
<body>

  <!-- Top Black Header -->
  <header>
    <a href="index.html" class="brand-container">
      <img src="grape-logo.png" alt="Grapevine Logo" class="brand-logo" onerror="this.style.display='none'">
      <img src="grapevine-title.png" alt="The Grapevine" class="brand-title" onerror="this.onerror=null; this.src=''; this.outerHTML='<h1 style=\'color:#ff007f;font-size:16px;\'>THE GRAPEVINE</h1>'">
    </a>
    <span class="hub-tagline">Underground DIY Hub</span>
  </header>

  <!-- Interactive Wall Surface -->
  <main>
    <!-- Adjust top% and left% coordinates as needed to align with your background image features -->
    
    <!-- Notice Board Hotspot -->
    <div class="hotspot" style="top: 35%; left: 30%;" 
         onclick="openStickerModal('Notice Board', 'Pinned gig announcements, musicians wanted posts, local DIY workshops, and scene classifieds updated live in real time.', 'grapes-sticker.png', 'notice-board.html')"
         onmouseenter="showMarquee('Notice Board')" onmouseleave="hideMarquee()"></div>

    <!-- Creator Directory Hotspot -->
    <div class="hotspot" style="top: 35%; left: 70%;" 
         onclick="openStickerModal('Creator Directory', 'An open directory of underground bands, zine makers, visual artists, independent venues, and local collectives.', 'keys-sticker.png', 'creator-directory.html')"
         onmouseenter="showMarquee('Creator Directory')" onmouseleave="hideMarquee()"></div>

    <!-- Oral History Hotspot -->
    <div class="hotspot" style="top: 65%; left: 30%;" 
         onclick="openStickerModal('Oral History Vault', 'Raw voice notes, gig memories, venue lore, and spoken stories submitted directly by members of our scene.', 'cassette-sticker.png', 'oral-history.html')"
         onmouseenter="showMarquee('Oral History Vault')" onmouseleave="hideMarquee()"></div>

    <!-- Past Gig Archive Hotspot -->
    <div class="hotspot" style="top: 65%; left: 70%;" 
         onclick="openStickerModal('Past Gig Archive', 'A crowd-sourced timeline of past local shows. Log headliners, support acts, setlist highlight songs, and photo stubs.', 'grenade-sticker.png', 'past-gigs.html')"
         onmouseenter="showMarquee('Past Gig Archive')" onmouseleave="hideMarquee()"></div>
  </main>

  <!-- Bottom Screen Marquee Bar -->
  <div id="hover-marquee"></div>

  <!-- Click Modal Popup -->
  <div id="sticker-modal" onclick="closeStickerModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <img id="modal-img" src="" class="modal-sticker-img" alt="Sticker">
      <h2 id="modal-title" class="modal-title"></h2>
      <p id="modal-desc" class="modal-desc"></p>
      <div class="modal-actions">
        <button class="modal-btn btn-close" onclick="closeStickerModal()">Back to Wall</button>
        <a id="modal-link" href="#" class="modal-btn btn-visit">Enter Page →</a>
      </div>
    </div>
  </div>

  <script>
    const marquee = document.getElementById('hover-marquee');

    function showMarquee(title) {
      marquee.innerText = `>>> ${title} <<<`;
      marquee.style.opacity = '1';
    }

    function hideMarquee() {
      marquee.style.opacity = '0';
    }

    function openStickerModal(title, desc, imgSrc, url) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-desc').innerText = desc;
      document.getElementById('modal-img').src = imgSrc;
      document.getElementById('modal-link').href = url;
      document.getElementById('sticker-modal').style.display = 'flex';
      hideMarquee();
    }

    function closeStickerModal() {
      document.getElementById('sticker-modal').style.display = 'none';
    }
  </script>
</body>
</html>
