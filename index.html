<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Grapevine Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0b0b;
      font-family: 'Courier New', Courier, monospace;
      color: #fff;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10000;
      background: rgba(18, 18, 18, 0.95);
      border-bottom: 2px solid #ff007f;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      color: #ff007f;
      font-size: 16px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .nav-links { display: flex; gap: 20px; align-items: center; font-size: 13px; text-transform: uppercase; }
    .nav-links a { color: #aaa; text-decoration: none; transition: color 0.2s; }
    .nav-links a:hover { color: #ff007f; }

    /* Main Wall Canvas Container */
    #wall-canvas {
      position: absolute;
      top: 55px;
      left: 0;
      width: 100vw;
      height: calc(100vh - 55px);
      background-color: #0d0d0d;
      background-image: url('IMG_1397.jpg');[cite: 1]
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
    }

    /* Interactive Stickers with Pulsing Pink Glow Animation */
    @keyframes pinkPulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 0, 127, 0.8); }
      70% { box-shadow: 0 0 0 16px rgba(255, 0, 127, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 0, 127, 0); }
    }

    .sticker {
      position: absolute;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.2s ease;
      animation: pinkPulse 2.5s infinite;
      border-radius: 8px;
      padding: 6px;
      background: rgba(0,0,0,0.5);
    }

    .sticker:hover {
      transform: scale(1.08);
    }

    .sticker img {
      display: block;
      max-width: 160px;
      height: auto;
      pointer-events: none;
      filter: drop-shadow(3px 5px 10px rgba(0,0,0,0.9));
    }

    /* Information Preview Modal */
    #preview-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 30000;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-card {
      background: #141414;
      border: 2px solid #ff007f;
      width: 100%;
      max-width: 400px;
      border-radius: 8px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 35px rgba(255, 0, 127, 0.5);
    }

    .modal-card img {
      max-width: 130px;
      max-height: 130px;
      object-fit: contain;
      margin-bottom: 16px;
      border: 1px solid #333;
      background: #000;
      padding: 4px;
    }

    .modal-card h3 {
      color: #ff007f;
      font-size: 18px;
      margin-bottom: 8px;
      text-transform: uppercase;
      text-align: center;
    }

    .modal-card p {
      color: #ccc;
      font-size: 13px;
      text-align: center;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .modal-btn {
      flex: 1;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      font-family: inherit;
    }

    .btn-visit { background: #ff007f; color: #000; border: none; }
    .btn-visit:hover { background: #ff3399; }
    .btn-close { background: transparent; color: #aaa; border: 1px solid #444; }
    .btn-close:hover { color: #fff; border-color: #777; }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">The Grapevine Hub</div>
    <div class="nav-links">
      <a href="notice-board.html">Notice Board</a>
      <a href="https://mollythirza.github.io/TheGrapevineMap/" target="_blank">Venue Map</a>
    </div>
  </header>

  <!-- Clean Wall Canvas -->
  <div id="wall-canvas">
    <!-- Sticker 1: Notice Board -->
    <div class="sticker" style="top: 25vh; left: 15vw;" onclick="openPreview('Notice Board', 'Explore community gig posters, DIY flyers, and underground announcements pinned live by creators.', 'notice-board.html', 'raccoon-sticker.png')">
      <img src="raccoon-sticker.png" alt="Notice Board Sticker" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'120\' height=\'120\'><rect width=\'120\' height=\'120\' fill=\'%23222\'/><text x=\'50%\' y=\'50%\' fill=\'%23ff007f\' font-size=\'14\' text-anchor=\'middle\' dy=\'.3em\'>Notice Board</text></svg>';">
    </div>

    <!-- Sticker 2: Venue Map -->
    <div class="sticker" style="top: 55vh; left: 65vw;" onclick="openPreview('Venue Map', 'Discover independent grassroots music venues, community spaces, and safe hubs across the scene.', 'https://mollythirza.github.io/TheGrapevineMap/', 'map-sticker.png')">
      <img src="map-sticker.png" alt="Venue Map Sticker" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'120\' height=\'120\'><rect width=\'120\' height=\'120\' fill=\'%23222\'/><text x=\'50%\' y=\'50%\' fill=\'%23ff007f\' font-size=\'14\' text-anchor=\'middle\' dy=\'.3em\'>Venue Map</text></svg>';">
    </div>
  </div>

  <!-- Information Preview Modal -->
  <div id="preview-modal">
    <div class="modal-card">
      <img id="modal-img" src="" alt="Sticker Preview">
      <h3 id="modal-title">Title</h3>
      <p id="modal-desc">Description text goes here...</p>
      <div class="modal-actions">
        <button class="modal-btn btn-close" onclick="closePreview()">Close</button>
        <a id="modal-link" href="#" class="modal-btn btn-visit">Go to Site →</a>
      </div>
    </div>
  </div>

  <script>
    const modal = document.getElementById('preview-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const modalLink = document.getElementById('modal-link');
    const modalImg = document.getElementById('modal-img');

    function openPreview(title, desc, targetUrl, imgSrc) {
      modalTitle.innerText = title;
      modalDesc.innerText = desc;
      modalLink.href = targetUrl;
      modalImg.src = imgSrc;
      modal.style.display = 'flex';
    }

    function closePreview() {
      modal.style.display = 'none';
    }

    modal.addEventListener('click', (e) => {
      if (e.target === modal) closePreview();
    });
  </script>
</body>
</html>
