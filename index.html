<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Grapevine Hub</title>
  <style>
    @import url('https://db.onlinewebfonts.com/c/33a778322e7d57ee578df9e00a59d75b?family=Monte+Stella+VF+Trial+Medium');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0b0b;
      font-family: 'Courier New', Courier, monospace;
      color: #fff;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10000;
      background: rgba(18, 18, 18, 0.95);
      border-bottom: 2px solid #ff007f;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(6px);
    }

    .brand-title {
      font-family: "Monte Stella VF Trial Medium", sans-serif;
      color: #ff007f;
      font-size: 18px;
    }

    .nav-links { display: flex; gap: 20px; align-items: center; font-size: 13px; text-transform: uppercase; }
    .nav-links a { color: #aaa; text-decoration: none; transition: color 0.2s; }
    .nav-links a:hover { color: #ff007f; }

    /* Zoomable Viewport Canvas */
    #viewport {
      position: absolute;
      top: 55px;
      left: 0;
      width: 100vw;
      height: calc(100vh - 55px);
      overflow: hidden;
      cursor: grab;
      background: #000;
    }

    #viewport:active { cursor: grabbing; }

    #canvas {
      position: absolute;
      width: 3000px;
      height: 2000px;
      transform-origin: 0 0;
    }

    /* Bathroom Wall Background */
    #wall-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('bathroom-wall.jpg') repeat;
      background-size: cover;
      z-index: 1;
    }

    /* Interactive Stickers */
    .sticker {
      position: absolute;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.2s ease;
      filter: drop-shadow(3px 5px 10px rgba(0,0,0,0.8));
    }

    .sticker:hover {
      transform: scale(1.08) rotate(2deg);
    }

    .sticker img {
      display: block;
      max-width: 180px;
      height: auto;
      pointer-events: none;
    }

    /* Reset View Button */
    #reset-view {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: #1a1a1a;
      border: 2px solid #ff007f;
      color: #ff007f;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      font-size: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 10001;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
      transition: background 0.2s, transform 0.2s;
    }

    #reset-view:hover {
      background: #ff007f;
      color: #000;
      transform: scale(1.1);
    }

    /* Information Preview Modal */
    #preview-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 30000;
      display: none;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(5px);
      padding: 20px;
    }

    .modal-card {
      background: #141414;
      border: 2px solid #ff007f;
      width: 100%;
      max-width: 400px;
      border-radius: 8px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 35px rgba(255, 0, 127, 0.5);
    }

    .modal-card img {
      max-width: 140px;
      max-height: 140px;
      object-fit: contain;
      margin-bottom: 16px;
      border: 1px solid #333;
    }

    .modal-card h3 {
      color: #ff007f;
      font-size: 18px;
      margin-bottom: 8px;
      text-transform: uppercase;
      text-align: center;
    }

    .modal-card p {
      color: #ccc;
      font-size: 13px;
      text-align: center;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .modal-btn {
      flex: 1;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    .btn-visit { background: #ff007f; color: #000; border: none; }
    .btn-visit:hover { background: #ff3399; }
    .btn-close { background: transparent; color: #aaa; border: 1px solid #444; }
    .btn-close:hover { color: #fff; border-color: #777; }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">The Grapevine Hub</div>
    <div class="nav-links">
      <a href="notice-board.html">Notice Board</a>
      <a href="https://mollythirza.github.io/TheGrapevineMap/" target="_blank">Venue Map</a>
    </div>
  </header>

  <!-- Zoomable Viewport Canvas -->
  <div id="viewport">
    <div id="canvas">
      <div id="wall-bg"></div>

      <!-- Sticker 1: Notice Board -->
      <div class="sticker" style="top: 400px; left: 600px;" onclick="openPreview('Notice Board', 'Explore community gig posters, DIY flyers, and underground announcements pinned live by creators.', 'notice-board.html', 'raccoon-sticker.png')">
        <img src="raccoon-sticker.png" alt="Notice Board Sticker" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'120\' height=\'120\'><rect width=\'120\' height=\'120\' fill=\'%23222\'/><text x=\'50%\' y=\'50%\' fill=\'%23ff007f\' font-size=\'14\' text-anchor=\'middle\' dy=\'.3em\'>Notice Board</text></svg>';">
      </div>

      <!-- Sticker 2: Venue Map -->
      <div class="sticker" style="top: 900px; left: 1600px;" onclick="openPreview('Venue Map', 'Discover independent grassroots music venues, community spaces, and safe hubs across the scene.', 'https://mollythirza.github.io/TheGrapevineMap/', 'map-sticker.png')">
        <img src="map-sticker.png" alt="Venue Map Sticker" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'120\' height=\'120\'><rect width=\'120\' height=\'120\' fill=\'%23222\'/><text x=\'50%\' y=\'50%\' fill=\'%23ff007f\' font-size=\'14\' text-anchor=\'middle\' dy=\'.3em\'>Venue Map</text></svg>';">
      </div>
    </div>
  </div>

  <!-- Reset View Button -->
  <button id="reset-view" title="Reset View" onclick="resetView()">→</button>

  <!-- Information Preview Modal -->
  <div id="preview-modal">
    <div class="modal-card">
      <img id="modal-img" src="" alt="Sticker Preview">
      <h3 id="modal-title">Title</h3>
      <p id="modal-desc">Description text goes here...</p>
      <div class="modal-actions">
        <button class="modal-btn btn-close" onclick="closePreview()">Close</button>
        <a id="modal-link" href="#" class="modal-btn btn-visit">Go to Site →</a>
      </div>
    </div>
  </div>

  <script>
    const viewport = document.getElementById('viewport');
    const canvas = document.getElementById('canvas');

    let scale = 1;
    let panX = -400;
    let panY = -300;
    let isDragging = false;
    let startX, startY;

    function updateTransform() {
      canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    updateTransform();

    // Pan & Drag Controls
    viewport.addEventListener('pointerdown', (e) => {
      isDragging = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
      viewport.setPointerCapture(e.pointerId);
    });

    viewport.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform();
    });

    viewport.addEventListener('pointerup', (e) => {
      isDragging = false;
      viewport.releasePointerCapture(e.pointerId);
    });

    // Zoom via Mouse Wheel
    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomIntensity = 0.1;
      const prevScale = scale;
      
      if (e.deltaY < 0) {
        scale = Math.min(scale + zoomIntensity, 2.5);
      } else {
        scale = Math.max(scale - zoomIntensity, 0.6);
      }

      const rect = viewport.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      panX = mouseX - (mouseX - panX) * (scale / prevScale);
      panY = mouseY - (mouseY - panY) * (scale / prevScale);

      updateTransform();
    }, { passive: false });

    function resetView() {
      scale = 1;
      panX = -400;
      panY = -300;
      updateTransform();
    }

    // Modal Control Functions
    const modal = document.getElementById('preview-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const modalLink = document.getElementById('modal-link');
    const modalImg = document.getElementById('modal-img');

    function openPreview(title, desc, targetUrl, imgSrc) {
      modalTitle.innerText = title;
      modalDesc.innerText = desc;
      modalLink.href = targetUrl;
      modalImg.src = imgSrc;
      modal.style.display = 'flex';
    }

    function closePreview() {
      modal.style.display = 'none';
    }

    modal.addEventListener('click', (e) => {
      if (e.target === modal) closePreview();
    });
  </script>
</body>
</html>
