<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Grapevine — Digital Zine Library</title>
  <style>
    @import url('https://db.onlinewebfonts.com/c/33a778322e7d57ee578df9e00a59d75b?family=Monte+Stella+VF+Trial+Medium');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100%;
      min-height: 100%;
      background-color: #0d0d0d;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      overflow-x: hidden;
    }

    /* Fixed Header matching Hub */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10000;
      background: rgba(13, 13, 13, 0.95);
      border-bottom: 2px solid #ff007f;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      height: 32px;
      width: auto;
      filter: drop-shadow(0 0 6px #ff007f);
    }

    .brand-title {
      font-family: "Monte Stella VF Trial Medium", sans-serif;
      color: #ff007f;
      font-size: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      align-items: center;
      font-size: 12px;
      text-transform: uppercase;
    }

    .nav-links a {
      color: #aaa;
      text-decoration: none;
      transition: color 0.2s, text-shadow 0.2s;
    }

    .nav-links a:hover {
      color: #ff007f;
      text-shadow: 0 0 8px #ff007f;
    }

    /* Main Container */
    main {
      max-width: 1200px;
      margin: 100px auto 60px;
      padding: 0 24px;
    }

    .hero-section {
      border: 1px solid #ff007f;
      background: rgba(20, 20, 20, 0.8);
      padding: 24px;
      border-radius: 6px;
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.25);
      margin-bottom: 30px;
    }

    .hero-section h1 {
      color: #ff007f;
      font-size: 24px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hero-section p {
      color: #bbb;
      font-size: 13px;
      line-height: 1.5;
    }

    /* Search & Filter Bar */
    .filter-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 30px;
      justify-content: space-between;
      align-items: center;
    }

    .search-input {
      background: #111;
      border: 1px solid #ff007f;
      color: #fff;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 13px;
      border-radius: 4px;
      outline: none;
      min-width: 260px;
      flex: 1;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
    }

    .search-input:focus {
      box-shadow: 0 0 12px rgba(255, 0, 127, 0.5);
    }

    .category-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: #141414;
      color: #aaa;
      border: 1px solid #333;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background: #ff007f;
      color: #000;
      border-color: #ff007f;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
    }

    /* Zine Grid */
    .zine-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .zine-card {
      background: #141414;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
      position: relative;
    }

    .zine-card:hover {
      transform: translateY(-4px);
      border-color: #ff007f;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.35);
    }

    .card-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      font-size: 10px;
      color: #ff007f;
      border: 1px solid #ff007f;
      padding: 2px 6px;
      border-radius: 3px;
      text-transform: uppercase;
    }

    .zine-cover {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #333;
      margin-bottom: 14px;
      background: #000;
    }

    .zine-info h3 {
      color: #fff;
      font-size: 15px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .zine-info .author {
      color: #888;
      font-size: 11px;
      display: block;
      margin-bottom: 10px;
    }

    .zine-desc {
      color: #bbb;
      font-size: 12px;
      line-height: 1.4;
      margin-bottom: 16px;
    }

    .btn-read {
      width: 100%;
      padding: 8px;
      background: transparent;
      border: 1px solid #ff007f;
      color: #ff007f;
      text-align: center;
      text-decoration: none;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: bold;
      border-radius: 3px;
      transition: background 0.2s, color 0.2s;
    }

    .btn-read:hover {
      background: #ff007f;
      color: #000;
    }

    /* Modal / Reader Preview */
    #preview-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 30000;
      display: none;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(5px);
      padding: 20px;
    }

    .modal-card {
      background: #141414;
      border: 2px solid #ff007f;
      width: 100%;
      max-width: 480px;
      border-radius: 8px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 35px rgba(255, 0, 127, 0.5);
    }

    .modal-cover {
      width: 140px;
      height: 180px;
      object-fit: cover;
      margin-bottom: 14px;
      border: 1px solid #ff007f;
      border-radius: 4px;
    }

    .modal-card h3 {
      color: #ff007f;
      font-size: 18px;
      margin-bottom: 4px;
      text-transform: uppercase;
      text-align: center;
    }

    .modal-meta {
      color: #888;
      font-size: 11px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .modal-card p {
      color: #ccc;
      font-size: 13px;
      text-align: center;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .modal-btn {
      flex: 1;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      font-family: inherit;
    }

    .btn-download { background: #ff007f; color: #000; border: none; }
    .btn-download:hover { background: #ff3399; }
    .btn-close { background: transparent; color: #aaa; border: 1px solid #444; }
    .btn-close:hover { color: #fff; border-color: #777; }
  </style>
</head>
