<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Grapevine — Past Gig Archive & Timeline</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100%;
      min-height: 100%;
      background-color: #0d0d0d;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      overflow-x: hidden;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10000;
      background: rgba(13, 13, 13, 0.95);
      border-bottom: 2px solid #ff007f;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-logo {
      height: 32px;
      width: auto;
      filter: drop-shadow(0 0 6px #ff007f);
      flex-shrink: 0;
    }

    .brand-title {
      max-height: 20px;
      width: auto;
      object-fit: contain;
      filter: invert(1);
    }

    .nav-links a {
      color: #aaa;
      text-decoration: none;
      font-size: 12px;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #ff007f;
      text-shadow: 0 0 8px #ff007f;
    }

    main {
      max-width: 900px;
      margin: 100px auto 80px;
      padding: 0 20px;
      position: relative;
    }

    /* Background Connection Lines SVG Layer */
    #connection-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .connection-line {
      stroke: #ff007f;
      stroke-width: 2;
      stroke-dasharray: 4 4;
      opacity: 0.6;
      animation: linePulse 3s infinite alternate;
    }

    @keyframes linePulse {
      0% { opacity: 0.3; filter: drop-shadow(0 0 2px rgba(255,0,127,0.3)); }
      100% { opacity: 0.8; filter: drop-shadow(0 0 8px #ff007f); }
    }

    /* Filter / Search Toolbar */
    .filter-toolbar {
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid #ff007f;
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 40px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.25);
      position: relative;
      z-index: 10;
    }

    .search-input {
      background: #0d0d0d;
      border: 1px solid #ff007f;
      color: #fff;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 16px;
      border-radius: 4px;
      outline: none;
      flex: 1;
      min-width: 240px;
    }

    .btn-log {
      background: #ff007f;
      color: #000;
      border: none;
      padding: 11px 18px;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
      white-space: nowrap;
    }

    .btn-log:hover {
      background: #ff3399;
    }

    /* Feed Container */
    .archive-feed {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 35px;
      z-index: 5;
    }

    /* Staggered Left / Right Posts */
    .gig-post {
      background: #141414;
      border: 1px solid rgba(255, 0, 127, 0.5);
      border-radius: 6px;
      padding: 20px;
      width: 75%;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.2);
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
      cursor: pointer;
      position: relative;
    }

    .gig-post.align-left {
      align-self: flex-start;
      margin-right: auto;
    }

    .gig-post.align-right {
      align-self: flex-end;
      margin-left: auto;
    }

    .gig-post:hover {
      border-color: #ff007f;
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.6);
      transform: scale(1.01);
      z-index: 20;
    }

    .gig-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .gig-title {
      color: #ff007f;
      font-size: 16px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .gig-date {
      font-size: 11px;
      color: #888;
      border: 1px solid #333;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .gig-meta {
      font-size: 11px;
      color: #aaa;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .gig-meta span span {
      color: #ff007f;
    }

    .gig-desc {
      font-size: 12px;
      color: #ccc;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .gig-thumb {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 4px;
      margin-top: 10px;
    }

    /* Mobile & Tablet override for staggered layout */
    @media(max-width: 768px) {
      .gig-post {
        width: 100% !important;
        align-self: center !important;
        margin: 0 !important;
      }
    }

    /* 📱 Fully Scrollable Mobile Modals 📱 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      z-index: 40000;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 16px;
      backdrop-filter: blur(6px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .modal-card {
      background: #141414;
      border: 2px solid #ff007f;
      width: 100%;
      max-width: 480px;
      max-height: 85vh;          /* Prevents bottom cutoff on mobile */
      overflow-y: auto;          /* Internal vertical scrolling */
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 0 35px rgba(255, 0, 127, 0.5);
      position: relative;
      margin: auto;
    }

    .modal-card h2 {
      color: #ff007f;
      font-size: 16px;
      text-transform: uppercase;
      margin-bottom: 14px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 10px;
      color: #aaa;
      text-transform: uppercase;
    }

    .form-control {
      background: #0d0d0d;
      border: 1px solid #333;
      color: #fff;
      padding: 9px;
      font-family: inherit;
      font-size: 16px; /* Prevents mobile browser auto-zoom */
      border-radius: 4px;
      outline: none;
      width: 100%;
    }

    .form-control:focus {
      border-color: #ff007f;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .modal-btn {
      flex: 1;
      padding: 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-submit { background: #ff007f; color: #000; border: none; }
    .btn-cancel { background: transparent; color: #aaa; border: 1px solid #444; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="https://mollythirza.github.io/TheGrapevineHub/" class="brand-container">
      <img src="grape-logo.png" alt="Grapevine Logo" class="brand-logo" onerror="this.style.display='none'">
      <img src="grapevine-title.png" alt="The Grapevine" class="brand-title" onerror="this.onerror=null; this.src=''; this.outerHTML='<h1 style=\'color:#ff007f;font-size:14px;\'>THE GRAPEVINE</h1>'">
    </a>
    <div class="nav-links">
      <a href="https://mollythirza.github.io/TheGrapevineHub/">← Back to Hub</a>
    </div>
  </header>

  <main>
    <div style="text-align: center; margin-bottom: 25px;">
      <h1 style="color: #ff007f; font-size: 22px; text-transform: uppercase; margin-bottom: 6px;">Past Gig Archive & Timeline</h1>
      <p style="color: #aaa; font-size: 12px;">Connected scene history. Glowing lines link shows sharing bands, venues, or genres.</p>
    </div>

    <!-- Filter & Search Bar -->
    <div class="filter-toolbar">
      <input type="text" id="search-input" class="search-input" placeholder="Search band, venue, genre..." oninput="window.filterGigs()">
      <button class="btn-log" onclick="window.openModal()">+ Log Past Gig</button>
    </div>

    <!-- Timeline Feed with SVG Connection Lines -->
    <div style="position: relative;">
      <svg id="connection-layer"></svg>
      <div class="archive-feed" id="archive-feed"></div>
    </div>
  </main>

  <!-- Log Gig Modal -->
  <div id="gig-modal" class="modal-overlay" onclick="window.closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <h2>Log Past Gig Memory</h2>
      <form id="gig-form">
        <div class="form-group">
          <label>Show / Event Title *</label>
          <input type="text" id="gig-title" class="form-control" placeholder="e.g. Summer Hardcore Fest" required>
        </div>
        <div class="form-group">
          <label>Band(s) Playing (comma separated) *</label>
          <input type="text" id="gig-bands" class="form-control" placeholder="e.g. Trash Talk, Scalple" required>
        </div>
        <div class="form-group">
          <label>Venue *</label>
          <input type="text" id="gig-venue" class="form-control" placeholder="e.g. The Underground Basement" required>
        </div>
        <div class="form-group">
          <label>Genre / Tag *</label>
          <input type="text" id="gig-genre" class="form-control" placeholder="e.g. Hardcore, Punk, Noise" required>
        </div>
        <div class="form-group">
          <label>Show Date *</label>
          <input type="date" id="gig-date" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Memories / Setlist Notes *</label>
          <textarea id="gig-desc" class="form-control" rows="2" placeholder="Highlights, crowd energy..." required></textarea>
        </div>
        <div class="form-group">
          <label>Photo / Stub (Optional)</label>
          <input type="file" id="gig-image" accept="image/*" class="form-control">
        </div>
        <div class="modal-actions">
          <button type="button" class="modal-btn btn-cancel" onclick="window.closeModal()">Cancel</button>
          <button type="submit" class="modal-btn btn-submit" id="submit-btn">Save to Archive →</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase Script Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBozbn-0iQNhjuAcmL-dYOUtbhIYTjccYk",
      authDomain: "the-grapevine-5c046.firebaseapp.com",
      databaseURL: "https://the-grapevine-5c046-default-rtdb.firebaseio.com",
      projectId: "the-grapevine-5c046",
      storageBucket: "the-grapevine-5c046.firebasestorage.app",
      messagingSenderId: "606976230856",
      appId: "1:606976230856:web:161a12734239f248ce2cfd",
      measurementId: "G-V1KW1QSNWS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const gigsRef = ref(db, 'past_gigs');

    let allGigs = [];

    // Load data from Firebase
    onValue(gigsRef, (snapshot) => {
      const data = snapshot.val();
      allGigs = [];
      if (data) {
        // Sort descending by timestamp (recent time posted first)
        allGigs = Object.keys(data).map(id => ({ id, ...data.id, ...data[id] })).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
      }
      window.filterGigs();
    });

    window.filterGigs = () => {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const feed = document.getElementById('archive-feed');
      feed.innerHTML = '';

      const filtered = allGigs.filter(item => {
        if (!query) return true;
        const matchTitle = (item.title || '').toLowerCase().includes(query);
        const matchBands = (item.bands || '').toLowerCase().includes(query);
        const matchVenue = (item.venue || '').toLowerCase().includes(query);
        const matchGenre = (item.genre || '').toLowerCase().includes(query);
        const matchDesc = (item.desc || '').toLowerCase().includes(query);
        return matchTitle || matchBands || matchVenue || matchGenre || matchDesc;
      });

      if (filtered.length === 0) {
        feed.innerHTML = `<p style="text-align:center; color:#666; padding: 40px; font-size: 12px;">No gig memories found matching your search.</p>`;
        document.getElementById('connection-layer').innerHTML = '';
        return;
      }

      filtered.forEach((item, index) => {
        const post = document.createElement('div');
        // Alternating Left / Right centering layout
        const alignmentClass = index % 2 === 0 ? 'align-left' : 'align-right';
        post.className = `gig-post ${alignmentClass}`;
        post.setAttribute('data-id', item.id);

        let imgHtml = item.imageSrc ? `<img src="${item.imageSrc}" class="gig-thumb" alt="Gig Stub">` : '';

        post.innerHTML = `
          <div class="gig-header">
            <h3 class="gig-title">${item.title}</h3>
            <span class="gig-date">${item.date || 'Unknown Date'}</span>
          </div>
          <div class="gig-meta">
            <span>Band(s): <span>${item.bands}</span></span>
            <span>Venue: <span>${item.venue}</span></span>
            <span>Genre: <span>${item.genre}</span></span>
          </div>
          <p class="gig-desc">${item.desc}</p>
          ${imgHtml}
        `;
        feed.appendChild(post);
      });

      // Draw glowing connection lines between shared bands/venues/genres after DOM paints
      setTimeout(drawConnections, 100);
    };

    // Draw glowing pink SVG lines linking posts with shared metadata
    function drawConnections() {
      const svgLayer = document.getElementById('connection-layer');
      svgLayer.innerHTML = '';
      const posts = document.querySelectorAll('.gig-post');
      const feedRect = document.getElementById('archive-feed').getBoundingClientRect();

      svgLayer.setAttribute('width', feedRect.width);
      svgLayer.setAttribute('height', document.getElementById('archive-feed').scrollHeight);

      for (let i = 0; i < allGigs.length; i++) {
        for (let j = i + 1; j < allGigs.length; j++) {
          const g1 = allGigs[i];
          const g2 = allGigs[j];

          const shareVenue = g1.venue && g2.venue && g1.venue.toLowerCase() === g2.venue.toLowerCase();
          const shareGenre = g1.genre && g2.genre && g1.genre.toLowerCase() === g2.genre.toLowerCase();
          
          // Check shared bands
          const bands1 = (g1.bands || '').toLowerCase().split(',').map(b => b.trim());
          const bands2 = (g2.bands || '').toLowerCase().split(',').map(b => b.trim());
          const shareBand = bands1.some(b => bands2.includes(b));

          if (shareVenue || shareGenre || shareBand) {
            const el1 = document.querySelector(`[data-id="${g1.id}"]`);
            const el2 = document.querySelector(`[data-id="${g2.id}"]`);

            if (el1 && el2) {
              const r1 = el1.getBoundingClientRect();
              const r2 = el2.getBoundingClientRect();

              const x1 = r1.left + (r1.width / 2) - feedRect.left;
              const y1 = r1.top + (r1.height / 2) - feedRect.top;
              const x2 = r2.left + (r2.width / 2) - feedRect.left;
              const y2 = r2.top + (r2.height / 2) - feedRect.top;

              const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
              line.setAttribute('x1', x1);
              line.setAttribute('y1', y1);
              line.setAttribute('x2', x2);
              line.setAttribute('y2', y2);
              line.setAttribute('class', 'connection-line');
              svgLayer.appendChild(line);
            }
          }
        }
      }
    }

    window.addEventListener('resize', () => { setTimeout(drawConnections, 200); });

    // Form Submission Handler
    document.getElementById('gig-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');

      const title = document.getElementById('gig-title').value.trim();
      const bands = document.getElementById('gig-bands').value.trim();
      const venue = document.getElementById('gig-venue').value.trim();
      const genre = document.getElementById('gig-genre').value.trim();
      const date = document.getElementById('gig-date').value;
      const desc = document.getElementById('gig-desc').value.trim();
      const imageInput = document.getElementById('gig-image');

      submitBtn.innerText = "Saving...";
      submitBtn.disabled = true;

      if (imageInput.files && imageInput.files[0]) {
        const reader = new FileReader();
        reader.onload = async function(event) {
          await pushToFirebase(title, bands, venue, genre, date, desc, event.target.result);
        };
        reader.readAsDataURL(imageInput.files[0]);
      } else {
        await pushToFirebase(title, bands, venue, genre, date, desc, null);
      }
    });

    async function pushToFirebase(title, bands, venue, genre, date, desc, imageSrc) {
      try {
        await push(gigsRef, {
          title, bands, venue, genre, date, desc, imageSrc,
          timestamp: Date.now()
        });
        window.closeModal();
      } catch (err) {
        alert("Error saving gig memory: Payload limit reached. Try a smaller image.");
      }
      document.getElementById('submit-btn').innerText = "Save to Archive →";
      document.getElementById('submit-btn').disabled = false;
    }

    window.openModal = () => {
      document.getElementById('gig-modal').style.display = 'flex';
      document.body.style.overflow = 'hidden';
    };

    window.closeModal = () => {
      document.getElementById('gig-modal').style.display = 'none';
      document.body.style.overflow = 'auto';
      document.getElementById('gig-form').reset();
    };
  </script>
</body>
</html>
