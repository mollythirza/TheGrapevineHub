<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Grapevine — Past Gig Archive & Timeline</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100%;
      min-height: 100%;
      background-color: #0d0d0d;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      overflow-x: hidden;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10000;
      background: rgba(13, 13, 13, 0.95);
      border-bottom: 2px solid #ff007f;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-logo {
      height: 32px;
      width: auto;
      filter: drop-shadow(0 0 6px #ff007f);
      flex-shrink: 0;
    }

    .brand-title {
      max-height: 20px;
      width: auto;
      object-fit: contain;
      filter: invert(1);
    }

    .nav-links a {
      color: #aaa;
      text-decoration: none;
      font-size: 12px;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #ff007f;
      text-shadow: 0 0 8px #ff007f;
    }

    main {
      max-width: 900px;
      margin: 100px auto 80px;
      padding: 0 20px;
      position: relative;
    }

    /* Background Connection Lines SVG Layer */
    #connection-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .connection-line {
      stroke: #ff007f;
      stroke-width: 2;
      stroke-dasharray: 4 4;
      opacity: 0.6;
      animation: linePulse 3s infinite alternate;
    }

    @keyframes linePulse {
      0% { opacity: 0.3; filter: drop-shadow(0 0 2px rgba(255,0,127,0.3)); }
      100% { opacity: 0.8; filter: drop-shadow(0 0 8px #ff007f); }
    }

    /* Filter / Search Toolbar */
    .filter-toolbar {
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid #ff007f;
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 40px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.25);
      position: relative;
      z-index: 10;
    }

    .search-input {
      background: #0d0d0d;
      border: 1px solid #ff007f;
      color: #fff;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 16px;
      border-radius: 4px;
      outline: none;
      flex: 1;
      min-width: 240px;
    }

    .btn-log {
      background: #ff007f;
      color: #000;
      border: none;
      padding: 11px 18px;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
      white-space: nowrap;
    }

    .btn-log:hover {
      background: #ff3399;
    }

    /* Feed Container */
    .archive-feed {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 35px;
      z-index: 5;
    }

    /* Staggered Left / Right Posts */
    .gig-post {
      background: #141414;
      border: 1px solid rgba(255, 0, 127, 0.5);
      border-radius: 6px;
      padding: 20px;
      width: 75%;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.2);
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
      cursor: pointer;
      position: relative;
    }

    .gig-post.align-left {
      align-self: flex-start;
      margin-right: auto;
    }

    .gig-post.align-right {
      align-self: flex-end;
      margin-left: auto;
    }

    .gig-post:hover {
      border-color: #ff007f;
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.6);
      transform: scale(1.01);
      z-index: 20;
    }

    .gig-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .gig-title {
      color: #ff007f;
      font-size: 16px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .gig-date {
      font-size: 11px;
      color: #888;
      border: 1px solid #333;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .gig-meta {
      font-size: 11px;
      color: #aaa;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .gig-meta span span {
      color: #ff007f;
    }

    .gig-desc {
      font-size: 12px;
      color: #ccc;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .gig-thumb-wrapper {
      width: 100%;
      height: 160px;
      overflow: hidden;
      border-radius: 4px;
      margin-top: 10px;
      background: #000;
      border: 1px solid #333;
    }

    .gig-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    @media(max-width: 768px) {
      .gig-post {
        width: 100% !important;
        align-self: center !important;
        margin: 0 !important;
      }
    }

    /* 📱 Fully Scrollable & Compact Mobile Modals 📱 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      z-index: 40000;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 12px;
      backdrop-filter: blur(6px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .modal-card {
      background: #141414;
      border: 2px solid #ff007f;
      width: 100%;
      max-width: 440px;
      max-height: 80vh;          /* Strictly contained to fit safely on phone screens */
      overflow-y: auto;          /* Enables internal scrolling */
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 0 35px rgba(255, 0, 127, 0.5);
      position: relative;
      margin: auto;
    }

    .modal-card h2 {
      color: #ff007f;
      font-size: 15px;
      text-transform: uppercase;
      margin-bottom: 10px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .form-group label {
      font-size: 10px;
      color: #aaa;
      text-transform: uppercase;
    }

    .form-control {
      background: #0d0d0d;
      border: 1px solid #333;
      color: #fff;
      padding: 8px;
      font-family: inherit;
      font-size: 16px; /* Prevents mobile browser auto-zoom */
      border-radius: 4px;
      outline: none;
      width: 100%;
    }

    .form-control:focus {
      border-color: #ff007f;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .modal-btn {
      flex: 1;
      padding: 9px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-submit { background: #ff007f; color: #000; border: none; }
    .btn-cancel { background: transparent; color: #aaa; border: 1px solid #444; }

    /* Image Cropper Preview Area */
    #crop-container {
      display: none;
      margin-top: 6px;
      text-align: center;
      background: #0d0d0d;
      border: 1px dashed #ff007f;
      padding: 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="https://mollythirza.github.io/TheGrapevineHub/" class="brand-container">
      <img src="grape-logo.png" alt="Grapevine Logo" class="brand-logo" onerror="this.style.display='none'">
      <img src="grapevine-title.png" alt="The Grapevine" class="brand-title" onerror="this.onerror=null; this.src=''; this.outerHTML='<h1 style=\'color:#ff007f;font-size:13px;\'>THE GRAPEVINE</h1>'">
    </a>
    <div class="nav-links">
      <a href="https://mollythirza.github.io/TheGrapevineHub/">← Back to Hub</a>
    </div>
  </header>

  <main>
    <div style="text-align: center; margin-bottom: 25px;">
      <h1 style="color: #ff007f; font-size: 22px; text-transform: uppercase; margin-bottom: 6px;">Past Gig Archive & Timeline</h1>
      <p style="color: #aaa; font-size: 12px;">Chronological timeline. Glowing lines connect shows sharing bands, venues, or genres.</p>
    </div>

    <!-- Filter & Search Bar -->
    <div class="filter-toolbar">
      <input type="text" id="search-input" class="search-input" placeholder="Search band, venue, genre..." oninput="window.filterGigs()">
      <button class="btn-log" onclick="window.openModal()">+ Log Past Gig</button>
    </div>

    <!-- Timeline Feed with SVG Connection Lines -->
    <div style="position: relative;">
      <svg id="connection-layer"></svg>
      <div class="archive-feed" id="archive-feed"></div>
    </div>
  </main>

  <!-- Log Gig Modal -->
  <div id="gig-modal" class="modal-overlay" onclick="window.closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <h2>Log Past Gig Memory</h2>
      <form id="gig-form">
        <div class="form-group">
          <label>Show / Event Title *</label>
          <input type="text" id="gig-title" class="form-control" placeholder="e.g. Summer Hardcore Fest" required>
        </div>
        <div class="form-group">
          <label>Band(s) Playing (comma separated) *</label>
          <input type="text" id="gig-bands" class="form-control" placeholder="e.g. Trash Talk, Scalple" required>
        </div>
        <div class="form-group">
          <label>Venue *</label>
          <input type="text" id="gig-venue" class="form-control" placeholder="e.g. The Underground Basement" required>
        </div>
        <div class="form-group">
          <label>Genre / Tag *</label>
          <input type="text" id="gig-genre" class="form-control" placeholder="e.g. Hardcore, Punk, Noise" required>
        </div>
        <div class="form-group">
          <label>Show Date *</label>
          <input type="date" id="gig-date" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Memories / Setlist Notes *</label>
          <textarea id="gig-desc" class="form-control" rows="2" placeholder="Highlights, crowd energy..." required></textarea>
        </div>
        <div class="form-group">
          <label>Photo / Stub (Optional)</label>
          <input type="file" id="gig-image" accept="image/*" class="form-control" onchange="window.handleImagePreview(this)">
        </div>
        
        <!-- Image Crop Preview -->
        <div id="crop-container">
          <span style="font-size:10px; color:#ff007f; display:block; margin-bottom:4px;">Crop Position / Focus:</span>
          <select id="crop-fit" class="form-control" style="font-size:12px; padding:4px;">
            <option value="center">Center Crop</option>
            <option value="top">Top Crop</option>
            <option value="bottom">Bottom Crop</option>
          </select>
          <div style="margin-top:6px; max-height: 90px; overflow:hidden; border-radius:3px;">
            <img id="preview-crop-img" style="width:100%; height:90px; object-fit:cover;" src="" alt="Crop Preview">
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="modal-btn btn-cancel" onclick="window.closeModal()">Cancel</button>
          <button type="submit" class="modal-btn btn-submit" id="submit-btn">Save to Archive →</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase Script Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBozbn-0iQNhjuAcmL-dYOUtbhIYTjccYk",
      authDomain: "the-grapevine-5c046.firebaseapp.com",
      databaseURL: "https://the-grapevine-5c046-default-rtdb.firebaseio.com",
      projectId: "the-grapevine-5c046",
      storageBucket: "the-grapevine-5c046.firebasestorage.app",
      messagingSenderId: "606976230856",
      appId: "1:606976230856:web:161a12734239f248ce2cfd",
      measurementId: "G-V1KW1QSNWS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const gigsRef = ref(db, 'past_gigs');

    let allGigs = [];
    let selectedImageBase64 = null;

    onValue(gigsRef, (snapshot) => {
      const data = snapshot.val();
      allGigs = [];
      if (data) {
        // Chronological sort: Newest Show Date first (descending)
        allGigs = Object.keys(data).map(id => ({ id, ...data[id] })).sort((a, b) => {
          const dateA = new Date(a.date || 0).getTime();
          const dateB = new Date(b.date || 0).getTime();
          return dateB - dateA;
        });
      }
      window.filterGigs();
    });

    window.filterGigs = () => {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const feed = document.getElementById('archive-feed');
      feed.innerHTML = '';

      const filtered = allGigs.filter(item => {
        if (!query) return true;
        return (item.title || '').toLowerCase().includes(query) ||
               (item.bands || '').toLowerCase().includes(query) ||
               (item.venue || '').toLowerCase().includes(query) ||
               (item.genre || '').toLowerCase().includes(query) ||
               (item.desc || '').toLowerCase().includes(query);
      });

      if (filtered.length === 0) {
        feed.innerHTML = `<p style="text-align:center; color:#666; padding: 40px; font-size: 12px;">No gig memories found matching your search.</p>`;
        document.getElementById('connection-layer').innerHTML = '';
        return;
      }

      filtered.forEach((item, index) => {
        const post = document.createElement('div');
        const alignmentClass = index % 2 === 0 ? 'align-left' : 'align-right';
        post.className = `gig-post ${alignmentClass}`;
        post.setAttribute('data-id', item.id);

        const fitPosition = item.cropFit || 'center';
        let imgHtml = item.imageSrc ? `
          <div class="gig-thumb-wrapper">
            <img src="${item.imageSrc}" class="gig-thumb" style="object-position: ${fitPosition};" alt="Gig Stub">
          </div>` : '';

        post.innerHTML = `
          <div class="gig-header">
            <h3 class="gig-title">${item.title}</h3>
            <span class="gig-date">${item.date || 'Unknown Date'}</span>
          </div>
          <div class="gig-meta">
            <span>Band(s): <span>${item.bands}</span></span>
            <span>Venue: <span>${item.venue}</span></span>
            <span>Genre: <span>${item.genre}</span></span>
          </div>
          <p class="gig-desc">${item.desc}</p>
          ${imgHtml}
        `;
        feed.appendChild(post);
      });

      setTimeout(drawConnections, 100);
    };

    function drawConnections() {
      const svgLayer = document.getElementById('connection-layer');
      svgLayer.innerHTML = '';
      const feed = document.getElementById('archive-feed');
      if (!feed) return;
      
      const feedRect = feed.getBoundingClientRect();
      svgLayer.setAttribute('width', feedRect.width);
      svgLayer.setAttribute('height', feed.scrollHeight);

      for (let i = 0; i < allGigs.length; i++) {
        for (let j = i + 1; j < allGigs.length; j++) {
          const g1 = allGigs[i];
          const g2 = allGigs[j];

          const shareVenue = g1.venue && g2.venue && g1.venue.toLowerCase() === g2.venue.toLowerCase();
          const shareGenre = g1.genre && g2.genre && g1.genre.toLowerCase() === g2.genre.toLowerCase();
          
          const bands1 = (g1.bands || '').toLowerCase().split(',').map(b => b.trim());
          const bands2 = (g2.bands || '').toLowerCase().split(',').map(b => b.trim());
          const shareBand = bands1.some(b => bands2.includes(b));

          if (shareVenue || shareGenre || shareBand) {
            const el1 = document.querySelector(`[data-id="${g1.id}"]`);
            const el2 = document.querySelector(`[data-id="${g2.id}"]`);

            if (el1 && el2) {
              const r1 = el1.getBoundingClientRect();
              const r2 = el2.getBoundingClientRect();

              const x1 = r1.left + (r1.width / 2) - feedRect.left;
              const y1 = r1.top + (r1.height / 2) - feedRect.top;
              const x2 = r2.left + (r2.width / 2) - feedRect.left;
              const y2 = r2.top + (r2.height / 2) - feedRect.top;

              const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
              line.setAttribute('x1', x1);
              line.setAttribute('y1', y1);
              line.setAttribute('x2', x2);
              line.setAttribute('y2', y2);
              line.setAttribute('class', 'connection-line');
              svgLayer.appendChild(line);
            }
          }
        }
      }
    }

    window.addEventListener('resize', () => { setTimeout(drawConnections, 200); });

    window.handleImagePreview = function(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          selectedImageBase64 = e.target.result;
          document.getElementById('preview-crop-img').src = selectedImageBase64;
          document.getElementById('crop-container').style.display = 'block';
        };
        reader.readAsDataURL(input.files[0]);
      }
    };

    document.getElementById('crop-fit').addEventListener('change', (e) => {
      document.getElementById('preview-crop-img').style.objectPosition = e.target.value;
    });

    document.getElementById('gig-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');

      const title = document.getElementById('gig-title').value.trim();
      const bands = document.getElementById('gig-bands').value.trim();
      const venue = document.getElementById('gig-venue').value.trim();
      const genre = document.getElementById('gig-genre').value.trim();
      const date = document.getElementById('gig-date').value;
      const desc = document.getElementById('gig-desc').value.trim();
      const cropFit = document.getElementById('crop-fit').value;

      submitBtn.innerText = "Saving...";
      submitBtn.disabled = true;

      try {
        await push(gigsRef, {
          title, bands, venue, genre, date, desc,
          imageSrc: selectedImageBase64 || null,
          cropFit,
          timestamp: Date.now()
        });
        window.closeModal();
      } catch (err) {
        alert("Error saving gig memory: Payload limit reached. Try a smaller image.");
      }
      submitBtn.innerText = "Save to Archive →";
      submitBtn.disabled = false;
    });

    window.openModal = () => {
      document.getElementById('gig-modal').style.display = 'flex';
      document.body.style.overflow = 'hidden';
    };

    window.closeModal = () => {
      document.getElementById('gig-modal').style.display = 'none';
      document.body.style.overflow = 'auto';
      document.getElementById('gig-form').reset();
      document.getElementById('crop-container').style.display = 'none';
      selectedImageBase64 = null;
    };
  </script>
</body>
</html>
