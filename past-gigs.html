<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Grapevine — Past Gig Archive & Timeline</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100%;
      min-height: 100%;
      background-color: #0d0d0d;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      overflow-x: hidden;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10000;
      background: rgba(13, 13, 13, 0.95);
      border-bottom: 2px solid #ff007f;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-logo {
      height: 28px;
      width: auto;
      filter: drop-shadow(0 0 6px #ff007f);
      flex-shrink: 0;
    }

    .brand-title {
      max-height: 18px;
      width: auto;
      object-fit: contain;
      filter: invert(1);
    }

    .nav-links a {
      color: #aaa;
      text-decoration: none;
      font-size: 11px;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #ff007f;
      text-shadow: 0 0 8px #ff007f;
    }

    main {
      max-width: 950px;
      margin: 90px auto 80px;
      padding: 0 14px;
      position: relative;
    }

    /* SVG Connection Lines Layer */
    #connection-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .connection-line {
      stroke: #ff007f;
      stroke-width: 2;
      stroke-dasharray: 4 4;
      opacity: 0.6;
      animation: linePulse 3s infinite alternate;
    }

    @keyframes linePulse {
      0% { opacity: 0.3; filter: drop-shadow(0 0 2px rgba(255,0,127,0.3)); }
      100% { opacity: 0.8; filter: drop-shadow(0 0 8px #ff007f); }
    }

    /* Filter Toolbar */
    .filter-toolbar {
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid #ff007f;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 30px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.25);
      position: relative;
      z-index: 10;
    }

    .search-input {
      background: #0d0d0d;
      border: 1px solid #ff007f;
      color: #fff;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 16px;
      border-radius: 4px;
      outline: none;
      flex: 1;
      min-width: 200px;
    }

    .btn-log {
      background: #ff007f;
      color: #000;
      border: none;
      padding: 10px 16px;
      font-family: inherit;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
      white-space: nowrap;
    }

    .btn-log:hover { background: #ff3399; }

    /* Timeline Feed */
    .archive-feed {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 25px;
      z-index: 5;
    }

    /* Enforced Alternating Staggered Feed Posts Across ALL Screen Sizes */
    .gig-post {
      background: #141414;
      border: 1px solid rgba(255, 0, 127, 0.5);
      border-radius: 6px;
      padding: 14px;
      width: 68%; /* Compact width to allow clear alternating spacing on phones too */
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.2);
      transition: border-color 0.2s, box-shadow 0.2s;
      position: relative;
      word-break: break-word;
    }

    .gig-post.align-left {
      align-self: flex-start;
      margin-right: auto;
    }

    .gig-post.align-right {
      align-self: flex-end;
      margin-left: auto;
    }

    .gig-post:hover {
      border-color: #ff007f;
      box-shadow: 0 0 22px rgba(255, 0, 127, 0.6);
      z-index: 20;
    }

    .gig-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
      flex-wrap: wrap;
      gap: 6px;
    }

    .gig-title {
      color: #ff007f;
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .gig-date {
      font-size: 10px;
      color: #888;
      border: 1px solid #333;
      padding: 2px 5px;
      border-radius: 3px;
    }

    .gig-meta {
      font-size: 10px;
      color: #aaa;
      margin-bottom: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .gig-meta span span { color: #ff007f; }

    .gig-desc {
      font-size: 11px;
      color: #ccc;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .gig-thumb-wrapper {
      width: 100%;
      height: 130px;
      overflow: hidden;
      border-radius: 4px;
      margin-top: 8px;
      background: #000;
      border: 1px solid #333;
    }

    .gig-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gig-author {
      font-size: 9px;
      color: #777;
      margin-top: 8px;
      border-top: 1px dashed #222;
      padding-top: 6px;
      text-transform: uppercase;
    }

    .gig-author span { color: #ff007f; }

    /* Fully Screen-Fitting Interactive Comment Section */
    .comments-section {
      margin-top: 10px;
      border-top: 1px solid rgba(255, 0, 127, 0.2);
      padding-top: 8px;
    }

    .comments-toggle {
      background: none;
      border: none;
      color: #ff007f;
      font-family: inherit;
      font-size: 10px;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: bold;
      padding: 0;
    }

    .comments-box {
      margin-top: 8px;
      display: none;
    }

    .comment-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 8px;
      max-height: 120px;
      overflow-y: auto;
    }

    .comment-item {
      background: #0d0d0d;
      border-left: 2px solid #ff007f;
      padding: 5px 8px;
      font-size: 10px;
      border-radius: 0 4px 4px 0;
      word-break: break-word;
    }

    .comment-author {
      color: #ff007f;
      font-weight: bold;
    }

    .comment-form {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .comment-input-name {
      background: #0d0d0d;
      border: 1px solid #333;
      color: #fff;
      padding: 5px 6px;
      font-family: inherit;
      font-size: 14px;
      border-radius: 4px;
      width: 90px;
      outline: none;
    }

    .comment-input-text {
      background: #0d0d0d;
      border: 1px solid #333;
      color: #fff;
      padding: 5px 6px;
      font-family: inherit;
      font-size: 14px;
      border-radius: 4px;
      flex: 1;
      min-width: 120px;
      outline: none;
    }

    .comment-input-name:focus, .comment-input-text:focus { border-color: #ff007f; }

    .btn-comment {
      background: #ff007f;
      color: #000;
      border: none;
      padding: 5px 10px;
      font-family: inherit;
      font-size: 9px;
      font-weight: bold;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Modal Overlay Structure */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.94);
      z-index: 40000;
      display: none;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 15px 10px 140px 10px;
      backdrop-filter: blur(6px);
    }

    .modal-card {
      background: #141414;
      border: 2px solid #ff007f;
      width: 100%;
      max-width: 420px;
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 0 35px rgba(255, 0, 127, 0.5);
      margin: 0 auto;
      position: relative;
    }

    .modal-card h2 {
      color: #ff007f;
      font-size: 13px;
      text-transform: uppercase;
      margin-bottom: 10px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .form-group label {
      font-size: 9px;
      color: #aaa;
      text-transform: uppercase;
      cursor: pointer;
    }

    .form-control {
      background: #0d0d0d;
      border: 1px solid #333;
      color: #fff;
      padding: 6px;
      font-family: inherit;
      font-size: 16px;
      border-radius: 4px;
      outline: none;
      width: 100%;
      touch-action: manipulation;
    }

    .form-control:focus {
      border-color: #ff007f;
      box-shadow: 0 0 6px rgba(255, 0, 127, 0.4);
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .modal-btn {
      flex: 1;
      padding: 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-submit { background: #ff007f; color: #000; border: none; }
    .btn-cancel { background: transparent; color: #aaa; border: 1px solid #444; }

    /* Fully Functional Manual Image Cropper */
    #manual-crop-container {
      display: none;
      margin-top: 6px;
      background: #0d0d0d;
      border: 1px dashed #ff007f;
      padding: 6px;
      border-radius: 4px;
    }

    .crop-preview-box {
      width: 100%;
      height: 90px;
      overflow: hidden;
      position: relative;
      border-radius: 3px;
      border: 1px solid #333;
      background: #000;
    }

    .crop-preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="https://mollythirza.github.io/TheGrapevineHub/" class="brand-container">
      <img src="grape-logo.png" alt="Grapevine Logo" class="brand-logo" onerror="this.style.display='none'">
      <img src="grapevine-title.png" alt="The Grapevine" class="brand-title" onerror="this.onerror=null; this.src=''; this.outerHTML='<h1 style=\'color:#ff007f;font-size:12px;\'>THE GRAPEVINE</h1>'">
    </a>
    <div class="nav-links">
      <a href="https://mollythirza.github.io/TheGrapevineHub/">← Back to Hub</a>
    </div>
  </header>

  <main>
    <div style="text-align: center; margin-bottom: 20px;">
      <h1 style="color: #ff007f; font-size: 20px; text-transform: uppercase; margin-bottom: 4px;">Past Gig Archive & Timeline</h1>
      <p style="color: #aaa; font-size: 11px;">Chronological timeline. Glowing lines connect shows sharing bands, venues, or genres.</p>
    </div>

    <!-- Filter & Search Bar -->
    <div class="filter-toolbar">
      <input type="text" id="search-input" class="search-input" placeholder="Search band, venue, song, genre..." oninput="window.filterGigs()">
      <button class="btn-log" onclick="window.openModal()">+ Log Past Gig</button>
    </div>

    <!-- Timeline Feed -->
    <div style="position: relative;">
      <svg id="connection-layer"></svg>
      <div class="archive-feed" id="archive-feed"></div>
    </div>
  </main>

  <!-- Log Gig Modal -->
  <div id="gig-modal" class="modal-overlay" onclick="window.closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <h2>Log Past Gig Memory</h2>
      <form id="gig-form">
        <div class="form-group">
          <label for="gig-title">Show / Event Title *</label>
          <input type="text" id="gig-title" class="form-control" placeholder="e.g. Summer Hardcore Fest" required>
        </div>
        <div class="form-group">
          <label for="gig-author">Logged By (Your Name / Handle) *</label>
          <input type="text" id="gig-author" class="form-control" placeholder="e.g. Alex DIY" required>
        </div>
        <div class="form-group">
          <label for="gig-bands">Band(s) Playing (comma separated) *</label>
          <input type="text" id="gig-bands" class="form-control" placeholder="e.g. Trash Talk, Scalple" required>
        </div>
        <div class="form-group">
          <label for="gig-venue">Venue *</label>
          <input type="text" id="gig-venue" class="form-control" placeholder="e.g. The Underground Basement" required>
        </div>
        <div class="form-group">
          <label for="gig-genre">Genre / Tag *</label>
          <input type="text" id="gig-genre" class="form-control" placeholder="e.g. Hardcore, Punk, Noise" required>
        </div>
        <div class="form-group">
          <label for="gig-date">Show Date *</label>
          <input type="date" id="gig-date" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="gig-song">Favorite Song / Track Highlight (Optional)</label>
          <input type="text" id="gig-song" class="form-control" placeholder="e.g. Awake / Unravel">
        </div>
        <div class="form-group">
          <label for="gig-desc">Memories / Setlist Notes *</label>
          <textarea id="gig-desc" class="form-control" rows="2" placeholder="Highlights, crowd energy..." required></textarea>
        </div>
        <div class="form-group">
          <label for="gig-image">Photo / Stub (Optional)</label>
          <input type="file" id="gig-image" accept="image/*" class="form-control" onchange="window.handleImagePreview(this)">
        </div>
        
        <!-- Functional Manual Crop Slider -->
        <div id="manual-crop-container">
          <label style="font-size:9px; color:#ff007f; display:block; margin-bottom:3px;">Drag Slider to Manually Crop Vertical Focus:</label>
          <input type="range" id="crop-slider" min="0" max="100" value="50" style="width:100%; margin-bottom:4px;" oninput="window.updateCropOffset(this.value)">
          <div class="crop-preview-box">
            <img id="manual-crop-img" class="crop-preview-img" src="" alt="Crop Preview">
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="modal-btn btn-cancel" onclick="window.closeModal()">Cancel</button>
          <button type="submit" class="modal-btn btn-submit" id="submit-btn">Save to Archive →</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBozbn-0iQNhjuAcmL-dYOUtbhIYTjccYk",
      authDomain: "the-grapevine-5c046.firebaseapp.com",
      databaseURL: "https://the-grapevine-5c046-default-rtdb.firebaseio.com",
      projectId: "the-grapevine-5c046",
      storageBucket: "the-grapevine-5c046.firebasestorage.app",
      messagingSenderId: "606976230856",
      appId: "1:606976230856:web:161a12734239f248ce2cfd",
      measurementId: "G-V1KW1QSNWS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const gigsRef = ref(db, 'past_gigs');

    let allGigs = [];
    let selectedImageBase64 = null;
    let manualCropOffset = 50;

    onValue(gigsRef, (snapshot) => {
      const data = snapshot.val();
      allGigs = [];
      if (data) {
        allGigs = Object.keys(data).map(id => ({ id, ...data[id] })).sort((a, b) => {
          const dateA = new Date(a.date || 0).getTime();
          const dateB = new Date(b.date || 0).getTime();
          return dateB - dateA;
        });
      }
      window.filterGigs();
    });

    window.filterGigs = () => {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const feed = document.getElementById('archive-feed');
      feed.innerHTML = '';

      const filtered = allGigs.filter(item => {
        if (!query) return true;
        return (item.title || '').toLowerCase().includes(query) ||
               (item.author || '').toLowerCase().includes(query) ||
               (item.bands || '').toLowerCase().includes(query) ||
               (item.venue || '').toLowerCase().includes(query) ||
               (item.genre || '').toLowerCase().includes(query) ||
               (item.song || '').toLowerCase().includes(query) ||
               (item.desc || '').toLowerCase().includes(query);
      });

      if (filtered.length === 0) {
        feed.innerHTML = `<p style="text-align:center; color:#666; padding: 30px; font-size: 11px;">No gig memories found matching your search.</p>`;
        document.getElementById('connection-layer').innerHTML = '';
        return;
      }

      filtered.forEach((item, index) => {
        const post = document.createElement('div');
        const alignmentClass = index % 2 === 0 ? 'align-left' : 'align-right';
        post.className = `gig-post ${alignmentClass}`;
        post.setAttribute('data-id', item.id);

        const cropPos = item.cropOffset !== undefined ? `${item.cropOffset}%` : '50%';
        let imgHtml = item.imageSrc ? `
          <div class="gig-thumb-wrapper">
            <img src="${item.imageSrc}" class="gig-thumb" style="object-position: 50% ${cropPos};" alt="Gig Stub">
          </div>` : '';

        let songHtml = item.song ? `<span>Highlight Track: <span>${item.song}</span></span>` : '';

        const comments = item.comments ? Object.values(item.comments) : [];
        let commentsListHtml = comments.map(c => `
          <div class="comment-item">
            <span class="comment-author">${c.author}:</span> ${c.text}
          </div>
        `).join('');

        post.innerHTML = `
          <div class="gig-header">
            <h3 class="gig-title">${item.title}</h3>
            <span class="gig-date">${item.date || 'Unknown Date'}</span>
          </div>
          <div class="gig-meta">
            <span>Band(s): <span>${item.bands}</span></span>
            <span>Venue: <span>${item.venue}</span></span>
            <span>Genre: <span>${item.genre}</span></span>
            ${songHtml}
          </div>
          <p class="gig-desc">${item.desc}</p>
          ${imgHtml}
          <div class="gig-author">Logged by: <span>${item.author || 'Anonymous'}</span></div>

          <!-- Interactive Comments Section -->
          <div class="comments-section">
            <button class="comments-toggle" onclick="window.toggleComments('${item.id}')">💬 Comments (${comments.length})</button>
            <div class="comments-box" id="comments-box-${item.id}">
              <div class="comment-list" id="comment-list-${item.id}">
                ${commentsListHtml || '<p style="font-size:9px; color:#555;">No comments yet. Start the conversation!</p>'}
              </div>
              <div class="comment-form">
                <input type="text" id="comment-author-${item.id}" class="comment-input-name" placeholder="Your Name" />
                <input type="text" id="comment-text-${item.id}" class="comment-input-text" placeholder="Add comment / suggest artist..." />
                <button class="btn-comment" onclick="window.addComment('${item.id}')">Post</button>
              </div>
            </div>
          </div>
        `;
        feed.appendChild(post);
      });

      setTimeout(drawConnections, 100);
    };

    window.toggleComments = (id) => {
      const box = document.getElementById(`comments-box-${id}`);
      if (box) {
        box.style.display = box.style.display === 'block' ? 'none' : 'block';
      }
    };

    window.addComment = async (gigId) => {
      const authorInput = document.getElementById(`comment-author-${gigId}`);
      const textInput = document.getElementById(`comment-text-${gigId}`);
      
      const author = authorInput.value.trim() || 'Anonymous';
      const text = textInput.value.trim();

      if (!text) return;

      const gigCommentsRef = ref(db, `past_gigs/${gigId}/comments`);
      await push(gigCommentsRef, {
        author,
        text,
        timestamp: Date.now()
      });

      textInput.value = '';
    };

    function drawConnections() {
      const svgLayer = document.getElementById('connection-layer');
      svgLayer.innerHTML = '';
      const feed = document.getElementById('archive-feed');
      if (!feed) return;
      
      const feedRect = feed.getBoundingClientRect();
      svgLayer.setAttribute('width', feedRect.width);
      svgLayer.setAttribute('height', feed.scrollHeight);

      for (let i = 0; i < allGigs.length; i++) {
        for (let j = i + 1; j < allGigs.length; j++) {
          const g1 = allGigs[i];
          const g2 = allGigs[j];

          const shareVenue = g1.venue && g2.venue && g1.venue.toLowerCase() === g2.venue.toLowerCase();
          const shareGenre = g1.genre && g2.genre && g1.genre.toLowerCase() === g2.genre.toLowerCase();
          
          const bands1 = (g1.bands || '').toLowerCase().split(',').map(b => b.trim());
          const bands2 = (g2.bands || '').toLowerCase().split(',').map(b => b.trim());
          const shareBand = bands1.some(b => bands2.includes(b));

          if (shareVenue || shareGenre || shareBand) {
            const el1 = document.querySelector(`[data-id="${g1.id}"]`);
            const el2 = document.querySelector(`[data-id="${g2.id}"]`);

            if (el1 && el2) {
              const r1 = el1.getBoundingClientRect();
              const r2 = el2.getBoundingClientRect();

              const x1 = r1.left + (r1.width / 2) - feedRect.left;
              const y1 = r1.top + (r1.height / 2) - feedRect.top;
              const x2 = r2.left + (r2.width / 2) - feedRect.left;
              const y2 = r2.top + (r2.height / 2) - feedRect.top;

              const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
              line.setAttribute('x1', x1);
              line.setAttribute('y1', y1);
              line.setAttribute('x2', x2);
              line.setAttribute('y2', y2);
              line.setAttribute('class', 'connection-line');
              svgLayer.appendChild(line);
            }
          }
        }
      }
    }

    window.addEventListener('resize', () => { setTimeout(drawConnections, 200); });

    // Working Manual Image Cropper Functionality
    window.handleImagePreview = function(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          selectedImageBase64 = e.target.result;
          const img = document.getElementById('manual-crop-img');
          img.src = selectedImageBase64;
          document.getElementById('manual-crop-container').style.display = 'block';
          document.getElementById('crop-slider').value = 50;
          window.updateCropOffset(50);
        };
        reader.readAsDataURL(input.files[0]);
      }
    };

    window.updateCropOffset = function(val) {
      manualCropOffset = val;
      const img = document.getElementById('manual-crop-img');
      if (img) {
        img.style.objectPosition = `50% ${val}%`;
      }
    };

    document.getElementById('gig-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');

      const title = document.getElementById('gig-title').value.trim();
      const author = document.getElementById('gig-author').value.trim();
      const bands = document.getElementById('gig-bands').value.trim();
      const venue = document.getElementById('gig-venue').value.trim();
      const genre = document.getElementById('gig-genre').value.trim();
      const date = document.getElementById('gig-date').value;
      const song = document.getElementById('gig-song').value.trim();
      const desc = document.getElementById('gig-desc').value.trim();

      submitBtn.innerText = "Saving...";
      submitBtn.disabled = true;

      try {
        await push(gigsRef, {
          title, author, bands, venue, genre, date, song, desc,
          imageSrc: selectedImageBase64 || null,
          cropOffset: manualCropOffset,
          timestamp: Date.now()
        });
        window.closeModal();
      } catch (err) {
        alert("Error saving gig memory: Payload limit reached. Try a smaller image.");
      }
      submitBtn.innerText = "Save to Archive →";
      submitBtn.disabled = false;
    });

    window.openModal = () => {
      const modal = document.getElementById('gig-modal');
      modal.style.display = 'block';
      modal.scrollTop = 0;
    };

    window.closeModal = () => {
      const modal = document.getElementById('gig-modal');
      modal.style.display = 'none';
      document.getElementById('gig-form').reset();
      document.getElementById('manual-crop-container').style.display = 'none';
      selectedImageBase64 = null;
    };
  </script>
</body>
</html>
